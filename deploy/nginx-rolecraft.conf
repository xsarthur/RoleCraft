# ============================================================
# Nginx 反向代理配置 — Rolecraft 内测
#
# 安装方式：
#   sudo cp deploy/nginx-rolecraft.conf /etc/nginx/conf.d/rolecraft.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   - 域名 DNS 已指向 Lighthouse 公网 IP（或用 IP 直接访问）
#   - 如需 HTTPS：sudo certbot --nginx -d your-domain.com
# ============================================================

# 上游：Rolecraft Node.js 服务，仅本地监听
upstream rolecraft_backend {
    server 127.0.0.1:4318;
    keepalive 16;
}

# ---------- HTTP -> HTTPS 跳转（有域名+证书时启用） ----------
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

# ---------- HTTPS（有域名+证书时启用） ----------
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#
#     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # 上面的配置块启用后，把下面 HTTP server 块的 location 部分复制过来
# }

# 限流：内测阶段每 IP 每秒 10 请求（必须在 http 上下文，不能在 server 内）
limit_req_zone $binary_remote_addr zone=rolecraft_limit:10m rate=10r/s;

# ---------- HTTP（无域名/纯 IP 内测时使用） ----------
server {
    listen 80;
    # 有域名改为此行：server_name your-domain.com;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端请求体限制（与服务端 128 KiB 限制对齐）
    client_max_body_size 256k;

    # 静态资源缓存（dist/ 下的 JS/CSS/图片）
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2)$ {
        proxy_pass http://rolecraft_backend;
        proxy_cache_bypass $http_upgrade;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # API 与动态请求
    location / {
        limit_req zone=rolecraft_limit burst=20 nodelay;

        proxy_pass http://rolecraft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（章节生成可能耗时较长）
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # 健康检查端点（可被 Lighthouse 监控或负载均衡使用）
    location = /api/health {
        proxy_pass http://rolecraft_backend;
        access_log off;
    }
}
