<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">视觉美不是装饰：同一任务的关系对照板</title>
  <desc id="desc">左侧示意逻辑内容完整但层级、间距、色彩和状态表达失去协调的版本，右侧示意同一内容经过焦点、比例、节奏、对比和重复编码整理后的版本。下方列出六个可观察的视觉判断关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14263d" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12243c"/>
      <stop offset="1" stop-color="#234a5a"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;}
      .title{font-size:42px;font-weight:700;fill:#fff;letter-spacing:1px}
      .sub{font-size:19px;fill:#dce9ee}
      .paneltitle{font-size:25px;font-weight:700;fill:#14263d}
      .label{font-size:16px;font-weight:700;fill:#14263d}
      .body{font-size:16px;fill:#405066}
      .small{font-size:14px;fill:#627085}
      .tiny{font-size:12px;fill:#627085}
      .line{stroke:#d6e0e5;stroke-width:2}
      .dark{fill:#14263d}
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f5f7f8"/>
  <rect x="0" y="0" width="1600" height="150" fill="url(#header)"/>
  <text x="74" y="70" class="sans title">视觉美不是装饰：同一任务的关系对照</text>
  <text x="74" y="111" class="sans sub">教学示意 · 内容、动作和状态相同；改变的是焦点、比例、节奏、对比与和谐</text>
  <rect x="1327" y="52" rx="20" width="188" height="40" fill="#d8f0e6"/>
  <text x="1421" y="78" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#14604a">可审阅示意 V01</text>

  <!-- left panel -->
  <rect x="64" y="190" width="708" height="610" rx="20" fill="#fff" filter="url(#shadow)"/>
  <rect x="64" y="190" width="708" height="68" rx="20" fill="#fff1ef"/>
  <rect x="64" y="238" width="708" height="20" fill="#fff1ef"/>
  <circle cx="104" cy="224" r="15" fill="#e76561"/>
  <text x="132" y="233" class="sans paneltitle">A　逻辑正确，但关系失去和谐</text>
  <text x="105" y="292" class="sans small">信息齐全 · 视觉焦点不稳定 · 间距和状态编码互相冲突</text>

  <rect x="94" y="326" width="648" height="435" rx="10" fill="#fafbfc" stroke="#e2e7eb" stroke-width="2"/>
  <!-- bad layout grid hint -->
  <line x1="118" y1="374" x2="714" y2="374" stroke="#ecf0f2" stroke-width="2"/>
  <rect x="118" y="347" width="92" height="24" rx="4" fill="#2c6c7f"/>
  <text x="164" y="364" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">学习工作台</text>
  <rect x="568" y="342" width="146" height="31" rx="15" fill="#e76561"/>
  <text x="641" y="362" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">继续阅读</text>

  <text x="120" y="420" class="sans" font-size="29" font-weight="700" fill="#14263d">澄湾客服助手</text>
  <text x="120" y="451" class="sans" font-size="14" fill="#617084">处理一条带来源的客服问题</text>
  <rect x="510" y="406" width="197" height="36" rx="18" fill="#eff7dc" stroke="#b3cf79" stroke-width="2"/>
  <text x="608" y="429" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#6b7c1d">待确认 / 进行中</text>

  <!-- irregular cards -->
  <rect x="120" y="490" width="236" height="104" rx="4" fill="#fff" stroke="#cbd4dc" stroke-width="2"/>
  <text x="137" y="525" class="sans" font-size="15" font-weight="700" fill="#14263d">步骤 02/04</text>
  <text x="137" y="558" class="sans" font-size="17" fill="#405066">确认来源范围</text>
  <text x="137" y="584" class="sans" font-size="13" fill="#9a4e4e">空白高度不一致</text>
  <rect x="396" y="478" width="311" height="127" rx="22" fill="#fff" stroke="#7e91a3" stroke-width="3"/>
  <text x="423" y="516" class="sans" font-size="12" fill="#778498">任务说明</text>
  <text x="423" y="554" class="sans" font-size="23" font-weight="700" fill="#14263d">先找到证据</text>
  <text x="423" y="581" class="sans" font-size="12" fill="#405066">按钮、标签、边框各自抢焦点</text>

  <rect x="120" y="630" width="587" height="92" rx="12" fill="#eef1fb" stroke="#b8c0e4" stroke-width="2"/>
  <circle cx="147" cy="676" r="12" fill="#6875d4"/>
  <text x="173" y="672" class="sans" font-size="16" font-weight="700" fill="#24316f">可选提示</text>
  <text x="173" y="697" class="sans" font-size="14" fill="#405066">颜色、圆角、阴影、按钮形状没有统一角色</text>
  <text x="120" y="749" class="sans tiny" fill="#ae5450">问题：不能只说“乱”，要指出哪种关系让阅读顺序失效</text>

  <!-- right panel -->
  <rect x="828" y="190" width="708" height="610" rx="20" fill="#fff" filter="url(#shadow)"/>
  <rect x="828" y="190" width="708" height="68" rx="20" fill="#e4f3ee"/>
  <rect x="828" y="238" width="708" height="20" fill="#e4f3ee"/>
  <circle cx="868" cy="224" r="15" fill="#238266"/>
  <path d="M860 224l6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="896" y="233" class="sans paneltitle">B　同一信息，关系协调可复用</text>
  <text x="869" y="292" class="sans small">焦点明确 · 4/8/16 间距节奏 · 状态有文字、形状和边界重复编码</text>

  <rect x="858" y="326" width="648" height="435" rx="10" fill="#fbfdfc" stroke="#d7e7e1" stroke-width="2"/>
  <line x1="886" y1="374" x2="1477" y2="374" stroke="#edf3f0" stroke-width="2"/>
  <rect x="886" y="347" width="92" height="24" rx="12" fill="#236b65"/>
  <text x="932" y="364" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">学习工作台</text>
  <text x="1450" y="364" text-anchor="end" class="sans" font-size="13" fill="#5a7b73">阶段 2 · 阅读</text>

  <text x="886" y="423" class="sans" font-size="29" font-weight="700" fill="#14263d">澄湾客服助手</text>
  <text x="886" y="453" class="sans" font-size="15" fill="#51676b">处理一条带来源的客服问题</text>
  <rect x="1272" y="402" width="196" height="38" rx="19" fill="#e9f4ed" stroke="#6ca88f" stroke-width="2"/>
  <circle cx="1296" cy="421" r="6" fill="#2d8065"/>
  <text x="1311" y="426" class="sans" font-size="14" font-weight="700" fill="#2d6a56">待确认</text>
  <text x="1380" y="426" class="sans" font-size="13" fill="#51676b">进行中</text>

  <rect x="886" y="491" width="591" height="104" rx="12" fill="#fff" stroke="#b9d6ca" stroke-width="2"/>
  <rect x="886" y="491" width="8" height="104" rx="4" fill="#2d8065"/>
  <text x="915" y="526" class="sans" font-size="14" font-weight="700" fill="#2d8065">步骤 02/04　·　信息结构</text>
  <text x="915" y="559" class="sans" font-size="20" font-weight="700" fill="#14263d">确认来源范围</text>
  <text x="915" y="585" class="sans" font-size="13" fill="#607174">先确认范围，再查看带出处的候选结果</text>
  <rect x="1300" y="530" width="145" height="40" rx="20" fill="#1f6d66"/>
  <text x="1372" y="555" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#fff">开始评审</text>

  <rect x="886" y="630" width="591" height="92" rx="12" fill="#f2f8f5" stroke="#d5e8df" stroke-width="2"/>
  <circle cx="918" cy="676" r="12" fill="#2d8065"/>
  <path d="M913 676l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="945" y="672" class="sans" font-size="16" font-weight="700" fill="#2d6a56">可选提示</text>
  <text x="945" y="697" class="sans" font-size="14" fill="#51676b">留白把任务卡、状态和行动分成三段，阅读顺序可预测</text>
  <text x="886" y="749" class="sans tiny" fill="#2d6a56">说明：统一不等于相同；状态仍用标签、形状、边界和颜色共同表达</text>

  <!-- bottom criteria -->
  <text x="64" y="850" class="sans paneltitle">六个可观察问题</text>
  <text x="64" y="882" class="sans small">用来批评作品，不用“高级/不好看”结束讨论</text>
  <g transform="translate(64,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">1</text>
    <text x="57" y="36" class="sans label">焦点</text><text x="20" y="69" class="sans body">第一眼看见什么？</text><text x="20" y="90" class="sans small">是否服务主任务？</text>
  </g>
  <g transform="translate(306,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">2</text>
    <text x="57" y="36" class="sans label">比例</text><text x="20" y="69" class="sans body">权重有差别吗？</text><text x="20" y="90" class="sans small">是否都在抢最大？</text>
  </g>
  <g transform="translate(548,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">3</text>
    <text x="57" y="36" class="sans label">节奏</text><text x="20" y="69" class="sans body">间距可预测吗？</text><text x="20" y="90" class="sans small">哪里该停顿？</text>
  </g>
  <g transform="translate(790,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">4</text>
    <text x="57" y="36" class="sans label">和谐</text><text x="20" y="69" class="sans body">元素像同一系统吗？</text><text x="20" y="90" class="sans small">统一中有对比吗？</text>
  </g>
  <g transform="translate(1032,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">5</text>
    <text x="57" y="36" class="sans label">语气</text><text x="20" y="69" class="sans body">它传达什么性格？</text><text x="20" y="90" class="sans small">是否符合受众和品牌？</text>
  </g>
  <g transform="translate(1274,915)">
    <rect width="226" height="107" rx="14" fill="#fff" stroke="#d5dde2"/>
    <circle cx="29" cy="31" r="15" fill="#e7f1ee"/><text x="29" y="37" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#2d8065">6</text>
    <text x="57" y="36" class="sans label">稳健</text><text x="20" y="69" class="sans body">放大/灰度仍可读？</text><text x="20" y="90" class="sans small">状态不靠颜色吗？</text>
  </g>
</svg>
