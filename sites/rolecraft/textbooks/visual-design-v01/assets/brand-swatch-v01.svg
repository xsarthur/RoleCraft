<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">澄湾临时色卡与版式锚点</title>
  <desc id="desc">教学虚构的背景、主色和强调色样本，以及不指定真实字体的层级说明。</desc>
  <rect width="980" height="360" fill="#ffffff"/>
  <text x="40" y="52" font-family="sans-serif" font-size="26" fill="#193943" font-weight="700">澄湾 · 教学临时色卡 V01</text>
  <rect x="40" y="92" width="190" height="150" rx="16" fill="#f3f7f8" stroke="#d7e5e7"/><text x="135" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">background</text><text x="135" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">#F3F7F8</text>
  <rect x="270" y="92" width="190" height="150" rx="16" fill="#335a66"/><text x="365" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">anchor</text><text x="365" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">#335A66</text>
  <rect x="500" y="92" width="190" height="150" rx="16" fill="#9CCBC4"/><text x="595" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">accent</text><text x="595" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">#9CCBC4</text>
  <rect x="730" y="92" width="190" height="150" rx="16" fill="#e8f3f4" stroke="#d7e5e7"/><text x="825" y="274" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">surface</text><text x="825" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#335a66">#E8F3F4</text>
  <text x="40" y="338" font-family="sans-serif" font-size="17" fill="#5e7d82">主标题、卖点、规格仅示意层级；字体、许可和最终颜色需由项目负责人确认。</text>
</svg>
