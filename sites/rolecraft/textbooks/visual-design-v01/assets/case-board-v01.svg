<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">澄湾视觉判断与 AI 修订教学板</title>
  <desc id="desc">五个面板展示原稿、层级方案、错误 AI 输出、人工修订后和4比5安全区重排。所有元素均为虚构教学示意。</desc>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#193943" flood-opacity="0.18"/></filter>
    <style>
      .h{font:700 26px sans-serif;fill:#193943}.s{font:18px sans-serif;fill:#335a66}.tiny{font:16px sans-serif;fill:#335a66}.bad{font:700 19px sans-serif;fill:#b33838}.good{font:700 19px sans-serif;fill:#23735d}.note{font:16px sans-serif;fill:#5e7d82}.panel{fill:#fff;stroke:#c9dddf;stroke-width:3}.bottle{fill:#e8f3f4;stroke:#335a66;stroke-width:5}.label{font:700 20px sans-serif;fill:#193943}.call{fill:none;stroke:#b33838;stroke-width:4;stroke-dasharray:8 6}.callgood{fill:none;stroke:#23735d;stroke-width:4;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f3f7f8"/>
  <text x="60" y="55" class="h">澄湾视觉判断与 AI 修订 · 教学虚构示意 V01</text>
  <text x="60" y="88" class="note">阅读顺序：先看焦点和层级，再看事实/结构错误，最后看人工修订与渠道安全区。不是真实商品图，也不是模型运行截图。</text>

  <rect x="50" y="125" width="470" height="385" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="75" y="165" class="h">A 原稿：背景抢走焦点</text>
  <rect x="80" y="195" width="410" height="270" rx="10" fill="#91b1c2"/>
  <circle cx="165" cy="260" r="68" fill="#d9ecff" opacity=".75"/><circle cx="400" cy="405" r="84" fill="#f6d3d0" opacity=".78"/>
  <rect x="246" y="250" width="100" height="162" rx="25" class="bottle"/><rect x="264" y="223" width="64" height="45" rx="12" fill="#335a66"/>
  <text x="296" y="320" text-anchor="middle" class="label">澄湾</text><text x="296" y="346" text-anchor="middle" class="tiny">150 ml</text>
  <text x="91" y="494" class="bad">背景对比高，产品小；主信息没有入口</text>
  <rect x="75" y="215" width="420" height="235" class="call"/>

  <rect x="565" y="125" width="470" height="385" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="590" y="165" class="h">B 方案：产品→卖点→规格</text>
  <rect x="595" y="195" width="410" height="270" rx="10" fill="#f3f7f8"/>
  <text x="625" y="238" class="label">海盐舒缓洁面泡沫</text><text x="625" y="268" class="s">产品识别先于装饰</text>
  <rect x="795" y="280" width="118" height="164" rx="30" class="bottle"/><rect x="816" y="250" width="76" height="44" rx="12" fill="#335a66"/>
  <text x="854" y="350" text-anchor="middle" class="label">澄湾</text><text x="854" y="378" text-anchor="middle" class="tiny">150 ml</text>
  <rect x="625" y="315" width="120" height="48" rx="24" fill="#9ccbc4"/><text x="685" y="346" text-anchor="middle" class="tiny">卖点待确认</text>
  <text x="625" y="425" class="note">焦点、主轴和证据位置可在三种渠道复用</text>
  <rect x="610" y="210" width="380" height="238" class="callgood"/>

  <rect x="1080" y="125" width="470" height="385" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="1105" y="165" class="h">C 错误 AI 输出：必须退回修订</text>
  <rect x="1110" y="195" width="410" height="270" rx="10" fill="#e5d6f5"/>
  <rect x="1270" y="250" width="104" height="168" rx="38" fill="#d8eef0" stroke="#335a66" stroke-width="5"/>
  <rect x="1290" y="220" width="64" height="45" rx="10" fill="#335a66"/>
  <text x="1322" y="325" text-anchor="middle" class="bad">澄湾</text><text x="1322" y="355" text-anchor="middle" class="bad">1500 ml</text>
  <path d="M1288 345 L1354 345" stroke="#b33838" stroke-width="6"/>
  <text x="1125" y="425" class="bad">容量改变 · 光线反向 · 医疗光晕</text>
  <path d="M1240 232 L1375 440" class="call"/><path d="M1375 232 L1240 440" class="call"/>

  <rect x="50" y="555" width="730" height="420" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="75" y="595" class="h">D 人工修订：事实回到来源，文字回到可编辑层</text>
  <rect x="85" y="630" width="660" height="270" rx="10" fill="#f3f7f8"/>
  <rect x="430" y="670" width="145" height="188" rx="34" class="bottle"/><rect x="458" y="640" width="89" height="50" rx="12" fill="#335a66"/>
  <text x="502" y="770" text-anchor="middle" class="label">澄湾</text><text x="502" y="802" text-anchor="middle" class="tiny">150 ml</text>
  <text x="120" y="700" class="label">海盐舒缓洁面泡沫</text><text x="120" y="735" class="s">卖点：待资料确认</text><text x="120" y="775" class="note">保留教学矢量/批准资产</text><text x="120" y="810" class="note">人工重排文字、阴影和图层</text><text x="120" y="845" class="good">来源与版本登记：V01-R2</text>
  <rect x="105" y="650" width="325" height="220" class="callgood"/>

  <rect x="825" y="555" width="725" height="420" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="850" y="595" class="h">E 4:5布局示意（非按比例）：安全区是输入条件</text>
  <rect x="1010" y="635" width="300" height="300" rx="10" fill="#f3f7f8" stroke="#335a66" stroke-width="4"/>
  <rect x="1010" y="635" width="300" height="58" fill="#d9e0e2" opacity=".9"/><rect x="1010" y="862" width="300" height="73" fill="#d9e0e2" opacity=".9"/>
  <text x="1160" y="671" text-anchor="middle" class="tiny">顶部安全区</text><text x="1160" y="910" text-anchor="middle" class="tiny">底部平台按钮区</text>
  <rect x="1070" y="725" width="90" height="130" rx="24" class="bottle"/><rect x="1087" y="704" width="56" height="34" rx="8" fill="#335a66"/>
  <text x="1115" y="785" text-anchor="middle" class="tiny">澄湾</text><text x="1115" y="810" text-anchor="middle" class="tiny">150 ml</text>
  <text x="1185" y="750" class="label">主信息上移</text><text x="1185" y="780" class="note">保持产品与品牌</text><text x="1185" y="810" class="note">舍弃非关键装饰</text>
  <rect x="1025" y="710" width="270" height="145" class="callgood"/>
  <text x="860" y="952" class="note">最小通过证据：能指出 A 的焦点问题、C 的三类错误、D 的修订来源、E 的安全区和被删内容。</text>
</svg>
