<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">规划失败分诊卡</title><desc id="desc">规划失败分为目标缺失、约束冲突、证据不足和重复失败，分别对应补充目标、等待审批、保留未知和停止升级。</desc>
<rect width="1200" height="380" rx="20" fill="#F8FAFC"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">规划失败先分诊，再决定是否重规划</text>
<g font-family="system-ui,sans-serif" font-size="16"><rect x="42" y="90" width="250" height="190" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="66" y="126" fill="#991B1B" font-weight="700">目标缺失</text><text x="66" y="158" fill="#0F172A">无法判断完成条件</text><text x="66" y="191" fill="#0F172A">→ 补充责任人目标</text><text x="66" y="224" fill="#0F172A">→ 不自行猜测</text>
<rect x="324" y="90" width="250" height="190" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="348" y="126" fill="#92400E" font-weight="700">约束冲突</text><text x="348" y="158" fill="#0F172A">权限或预算不允许</text><text x="348" y="191" fill="#0F172A">→ 等待批准 / 缩小范围</text><text x="348" y="224" fill="#0F172A">→ 不绕过闸门</text>
<rect x="606" y="90" width="250" height="190" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="630" y="126" fill="#075985" font-weight="700">证据不足</text><text x="630" y="158" fill="#0F172A">观察结果不完整</text><text x="630" y="191" fill="#0F172A">→ 标记 UNKNOWN</text><text x="630" y="224" fill="#0F172A">→ 补证或人工核对</text>
<rect x="888" y="90" width="250" height="190" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="912" y="126" fill="#5B21B6" font-weight="700">重复失败</text><text x="912" y="158" fill="#0F172A">同类修订没有新证据</text><text x="912" y="191" fill="#0F172A">→ 停止循环并升级</text><text x="912" y="224" fill="#0F172A">→ 记录失败边界</text></g>
<text x="42" y="330" font-family="system-ui,sans-serif" font-size="14" fill="#475569">颜色仅辅助；每张卡同时使用标题、位置和动作标签。示意构造，未表示真实运行结果。</text></svg>
