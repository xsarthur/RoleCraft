<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">上下文与记忆四层模型</title>
<desc id="desc">会话历史、权威任务状态、当轮上下文投影和长期记忆各自保存不同对象。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="40" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">四种保存对象，四种生命周期</text>
<rect x="30" y="90" width="200" height="130" rx="16" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
<text x="130.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">1 会话历史</text>
<text x="130.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#17324d">消息与引用</text>
<text x="130.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#17324d">追溯</text>
<rect x="270" y="90" width="200" height="130" rx="16" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="370.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f370e">2 权威任务状态</text>
<text x="370.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#5f370e">目标、版本、账本</text>
<text x="370.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#5f370e">恢复</text>
<rect x="510" y="90" width="200" height="130" rx="16" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/>
<text x="610.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#3f2a61">3 当轮上下文</text>
<text x="610.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#3f2a61">有限证据投影</text>
<text x="610.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#3f2a61">每轮重建</text>
<rect x="750" y="90" width="200" height="130" rx="16" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="850.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#174b2b">4 长期记忆</text>
<text x="850.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#174b2b">已筛选、可纠正</text>
<text x="850.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#174b2b">跨轮复用</text>
<line x1="230" y1="155.0" x2="262" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<line x1="470" y1="155.0" x2="502" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<line x1="710" y1="155.0" x2="742" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<text x="500" y="270" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" fill="#475569">颜色辅助分层；每个状态由文字和位置共同表达。教学构造，未表示真实存储实现。</text>
<text x="30" y="300" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#64748b">设计稿 v02｜窄屏见 *-narrow-v02</text>
</svg>
