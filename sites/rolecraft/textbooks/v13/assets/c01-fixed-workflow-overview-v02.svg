<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d">
<title id="t">固定流程如何完成受控交付：阅读总览</title>
<desc id="d">报告 → 固定映射 → 候选 → 批准 → 写入 → 核对。颜色辅助区分起点、处理中间步骤和结论。箭头完全落在节点间距内，不被节点遮盖。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<!-- title / subtitle -->
<text x="28" y="36" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">固定流程如何完成受控交付</text>
<text x="28" y="60" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">先看证据推进，再阅读正文中的机制与失败分支</text>
<!-- nodes first (paint under arrows); 6×125w, gutter=40, left=25 -->
<!-- 1 报告 -->
<rect x="25" y="100" width="125" height="72" rx="14" fill="#0f766e" stroke="#334155" stroke-width="2"/>
<text x="87.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">报告</text>
<!-- 2 固定映射 -->
<rect x="190" y="100" width="125" height="72" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="252.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">固定映射</text>
<!-- 3 候选 -->
<rect x="355" y="100" width="125" height="72" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="417.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">候选</text>
<!-- 4 批准 -->
<rect x="520" y="100" width="125" height="72" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="582.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">批准</text>
<!-- 5 写入 -->
<rect x="685" y="100" width="125" height="72" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="747.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">写入</text>
<!-- 6 核对 -->
<rect x="850" y="100" width="125" height="72" rx="14" fill="#0f766e" stroke="#334155" stroke-width="2"/>
<text x="912.5" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">核对</text>
<!-- arrows last; fully inside gutters; x2 = next.left - 8 -->
<line x1="155" y1="136" x2="182" y2="136" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="320" y1="136" x2="347" y2="136" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="485" y1="136" x2="512" y2="136" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="136" x2="677" y2="136" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="815" y1="136" x2="842" y2="136" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<!-- footer -->
<text x="28" y="220" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">图示为教学结构；具体执行状态以本章记录和独立验证为准。</text>
</svg>
