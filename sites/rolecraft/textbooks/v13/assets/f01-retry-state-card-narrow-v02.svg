<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" role="img" aria-labelledby="title desc">
<title id="title">请求状态与重试边界（窄屏纵栈）</title>
<desc id="desc">请求前拒绝，请求后区分确认成功、临时不可用和未知效果；未知不能直接重发。窄屏一列一状态。</desc>
<defs><marker id="arr-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="32" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">状态先于重试</text>
<text x="24" y="54" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">请求前→成功 / 临时 / 未知 · 纵栈</text>
<rect x="36" y="80" width="328" height="88" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="200" y="114" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f370e">1 请求前</text>
<text x="200" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#5f370e">拒绝或放行</text>
<rect x="36" y="198" width="328" height="88" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="200" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#174b2b">2 已确认成功</text>
<text x="200" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#174b2b">结束并引用</text>
<rect x="36" y="316" width="328" height="88" rx="14" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
<text x="200" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">3 临时不可用</text>
<text x="200" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#17324d">按合同有限重试</text>
<rect x="36" y="434" width="328" height="88" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/>
<text x="200" y="468" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#742a2a">4 效果未知</text>
<text x="200" y="496" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#742a2a">先核原操作</text>
<line x1="200" y1="172" x2="200" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="290" x2="200" y2="308" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="408" x2="200" y2="426" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<text x="24" y="566" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#64748b">设计稿 narrow-v02｜教学构造</text>
</svg>
