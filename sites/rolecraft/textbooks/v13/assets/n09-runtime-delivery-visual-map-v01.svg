<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370"><title>Runtime delivery map</title><desc>Maps build, release, runtime observation and rollback boundaries; instructional diagram.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="1080" height="370" fill="#FAFAF9"/><text x="42" y="42" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1F2937">让长任务在故障、容量和成本约束下交付</text><text x="42" y="72" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#475569">保存可继续调查的状态，把超时、并发、熔断和部分成功分开处理。</text><rect x="42" y="118" width="210" height="112" rx="16" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/><text x="147" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#173B70">任务状态</text><text x="147" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#173B70">并发容量</text><text x="147" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#173B70">状态/证据</text><path d="M252 174 H288" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="308" y="118" width="210" height="112" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="413" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7A4100">超时熔断</text><text x="413" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#7A4100">部分成功</text><text x="413" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7A4100">状态/证据</text><path d="M518 174 H554" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="574" y="118" width="210" height="112" rx="16" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="679" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#14532D">可继续调查</text><text x="679" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#14532D">队列与配额</text><text x="679" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#14532D">状态/证据</text><path d="M784 174 H820" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="840" y="118" width="210" height="112" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><text x="945" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7F1D1D">重试与停止</text><text x="945" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#7F1D1D">补偿与通知</text><text x="945" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7F1D1D">状态/证据</text><rect x="42" y="270" width="1010" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/><text x="62" y="302" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">阅读任务：沿四步检查输入、控制、证据与停止条件；颜色只是分组，文字和形状提供完整含义。</text><text x="42" y="350" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#64748B">设计稿 v01｜来源：对应单元正文｜浏览器、窄屏与读屏尚未验证</text></svg>