<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">工具调用与权限边界</title><desc id="desc">模型提出工具意图，宿主依次检查身份、对象范围、参数和批准，只有通过后才执行并记录结果。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker></defs><rect width="1200" height="520" rx="24" fill="#F8FAFC"/><text x="46" y="52" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#0F172A">工具是受控入口，不是模型的权限延伸</text><text x="46" y="82" font-family="system-ui,sans-serif" font-size="16" fill="#475569">每次调用都经过宿主检查；资料内容可以影响建议，不能批准动作。</text>
<g font-family="system-ui,sans-serif" font-size="16"><rect x="48" y="150" width="190" height="120" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="72" y="188" fill="#5B21B6" font-weight="700">模型提议</text><text x="72" y="218" fill="#0F172A">工具名 + 参数</text><text x="72" y="244" fill="#0F172A">不等于批准</text><rect x="286" y="150" width="190" height="120" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="310" y="188" fill="#075985" font-weight="700">身份核验</text><text x="310" y="218" fill="#0F172A">谁在请求？</text><text x="310" y="244" fill="#0F172A">租户 / 会话</text><rect x="524" y="150" width="190" height="120" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="548" y="188" fill="#92400E" font-weight="700">范围与参数</text><text x="548" y="218" fill="#0F172A">对象、字段、数量</text><text x="548" y="244" fill="#0F172A">拒绝越界值</text><rect x="762" y="150" width="190" height="120" rx="15" fill="#FDE68A" stroke="#B45309" stroke-width="2"/><text x="786" y="188" fill="#78350F" font-weight="700">准确批准</text><text x="786" y="218" fill="#0F172A">人或策略确认</text><text x="786" y="244" fill="#0F172A">副作用前确认</text><rect x="1000" y="150" width="150" height="120" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="1024" y="188" fill="#166534" font-weight="700">执行记录</text><text x="1024" y="218" fill="#0F172A">结果 + 审计</text></g>
<path d="M238 210H278M476 210H516M714 210H754M952 210H992" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="48" y="350" width="1104" height="80" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="72" y="382" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#991B1B">任何检查失败：拒绝并记录原因</text><text x="72" y="410" font-family="system-ui,sans-serif" font-size="15" fill="#0F172A">不要先返回秘密再过滤；资料中的“请忽略规则”不能改变身份、范围或批准结果。</text><text x="48" y="478" font-family="system-ui,sans-serif" font-size="14" fill="#475569">颜色仅辅助；状态同时由标题、位置和动作标签表达。示意构造，未表示真实权限系统。</text></svg>
