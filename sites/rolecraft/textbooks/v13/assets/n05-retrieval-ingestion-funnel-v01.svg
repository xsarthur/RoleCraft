<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">检索摄取漏斗</title><desc id="desc">原始教材经过版本确认、分节切分、元数据绑定、索引和召回排序，最后返回带来源的候选内容；每步都可拒绝不合格输入。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker></defs><rect width="1200" height="560" rx="24" fill="#F8FAFC"/><text x="46" y="52" font-family="system-ui,sans-serif" font-size="27" font-weight="700" fill="#0F172A">检索质量从摄取开始：每层都保留来源</text><text x="46" y="82" font-family="system-ui,sans-serif" font-size="16" fill="#475569">漏斗越往下越窄，表示候选减少；不合格内容在进入索引前被拦截。</text><g font-family="system-ui,sans-serif" font-size="16"><path d="M110 140 H1090 L1000 245 H200 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="600" y="184" text-anchor="middle" fill="#075985" font-weight="700">1 原始教材与版本</text><text x="600" y="213" text-anchor="middle" fill="#0F172A">确认来源、版本、冻结状态</text><path d="M200 262 H1000 L930 350 H270 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="600" y="302" text-anchor="middle" fill="#5B21B6" font-weight="700">2 分节与元数据</text><text x="600" y="330" text-anchor="middle" fill="#0F172A">标题、锚点、能力标签、可引用范围</text><path d="M270 367 H930 L865 447 H335 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="600" y="405" text-anchor="middle" fill="#166534" font-weight="700">3 索引、召回与排序</text><text x="600" y="433" text-anchor="middle" fill="#0F172A">规则 / 语义候选 → 版本与来源校验</text><rect x="430" y="468" width="340" height="50" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="600" y="500" text-anchor="middle" fill="#92400E" font-weight="700">返回候选 + 原文定位 + 证据状态</text></g><text x="48" y="545" font-family="system-ui,sans-serif" font-size="14" fill="#475569">颜色仅辅助；每层有编号与标题。示意构造，未表示召回率或真实运行数据。</text></svg>
