<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="v13-title v13-desc">
<title id="v13-title">真实任务的问题证据链</title>
<desc id="v13-desc">用户任务与过程反例同现实基线对照，经过状态与证据记录后形成可证据化问题，并判断是否值得解决；图示要求先记录观察再提出假设，不表示已有用户研究结果。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="1080" height="370" fill="#FAFAF9"/><text x="42" y="42" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1F2937">从真实任务取得问题证据</text><text x="42" y="72" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#475569">把用户问题、过程反例和基线方案分开记录，避免先有方案再找理由。</text><rect x="42" y="118" width="210" height="112" rx="16" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/><text x="147" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#173B70">用户任务</text><text x="147" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#173B70">过程反例</text><text x="147" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#173B70">状态/证据</text><path d="M252 174 H288" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="308" y="118" width="210" height="112" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="413" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7A4100">现实基线</text><text x="413" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#7A4100">可证据化问题</text><text x="413" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7A4100">状态/证据</text><path d="M518 174 H554" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="574" y="118" width="210" height="112" rx="16" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="679" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#14532D">发生了什么</text><text x="679" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#14532D">哪里失败</text><text x="679" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#14532D">状态/证据</text><path d="M784 174 H820" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="840" y="118" width="210" height="112" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><text x="945" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7F1D1D">现在怎样做</text><text x="945" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#7F1D1D">值得解决吗</text><text x="945" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7F1D1D">状态/证据</text><rect x="42" y="270" width="1010" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/><text x="62" y="302" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">阅读任务：沿四步检查输入、控制、证据与停止条件；颜色只是分组，文字和形状提供完整含义。</text><text x="42" y="350" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#64748B">设计稿 v01｜来源：对应单元正文｜浏览器、窄屏与读屏尚未验证</text></svg>