<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><title>上下文与记忆四层模型</title><desc>会话历史、权威任务状态、当轮上下文投影和长期记忆各自保存不同对象。</desc><rect width="1200" height="300" fill="#f8fafc"/><text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#17324d">四种保存对象，四种生命周期</text><g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="40" y="90" width="220" height="120" rx="16" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/><text x="150" y="130">会话历史</text><text x="150" y="160">消息与引用</text><text x="150" y="188">追溯</text><rect x="330" y="90" width="220" height="120" rx="16" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="440" y="130">权威任务状态</text><text x="440" y="160">目标、版本、账本</text><text x="440" y="188">恢复</text><rect x="620" y="90" width="220" height="120" rx="16" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/><text x="730" y="130">当轮上下文</text><text x="730" y="160">有限证据投影</text><text x="730" y="188">每轮重建</text><rect x="910" y="90" width="220" height="120" rx="16" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="1020" y="130">长期记忆</text><text x="1020" y="160">已筛选、可纠正</text><text x="1020" y="188">跨轮复用</text></g><g stroke="#64748b" stroke-width="3"><path d="M260 150h60"/><path d="M550 150h60"/><path d="M840 150h60"/></g><g fill="#64748b"><path d="M320 150l-12-8v16z"/><path d="M610 150l-12-8v16z"/><path d="M900 150l-12-8v16z"/></g></svg>