<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="980" height="280" fill="#FAFAF9"/><text x="40" y="42" font-size="25" font-weight="700" fill="#1F2937">工具怎样被发现、选择并安全执行：失败现场</text><text x="40" y="72" font-size="15" fill="#475569">识别失败类型，保留证据，再做有界处理。</text><rect x="55" y="100" width="220" height="100" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><text x="165" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#7F1D1D">发现失败</text><text x="165" y="168" text-anchor="middle" font-size="14" fill="#7F1D1D">协议 / 业务 / 效果未知</text><path d="M275 150H380" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/><rect x="385" y="100" width="220" height="100" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="495" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#7A4100">保留现场</text><text x="495" y="168" text-anchor="middle" font-size="14" fill="#7A4100">版本、输入、尝试、引用</text><path d="M605 150H710" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/><rect x="715" y="100" width="220" height="100" rx="16" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="825" y="138" text-anchor="middle" font-size="18" font-weight="700" fill="#14532D">有界处理</text><text x="825" y="168" text-anchor="middle" font-size="14" fill="#14532D">修订、等待或交接</text><text x="40" y="245" font-size="13" fill="#64748B">颜色用于分组；文字与箭头保持分离，图像不可用时以正文和代码降级。</text></svg>