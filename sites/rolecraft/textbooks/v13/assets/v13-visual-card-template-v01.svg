<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="v13-title v13-desc">
<title id="v13-title">单元视觉卡片模板</title>
<desc id="v13-desc">模板用输入、控制、验证和边界四栏组织一个单元的核心判断，并为每栏保留状态与证据位置；占位文字需由对应单元替换，图示不代表具体课程内容或学习效果。</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs>
  <rect width="1080" height="370" fill="#FAFAF9"/>
  <text x="42" y="42" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1F2937">单元标题：一句话说明核心判断</text>
  <text x="42" y="72" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#475569">副标题：说明读者要观察的输入、动作、证据和停止条件。</text>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <rect x="42" y="118" width="210" height="112" rx="16" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/><text x="147" y="154" font-size="19" font-weight="700" fill="#173B70">输入</text><text x="147" y="184" font-size="14" fill="#173B70">约束与目标</text><text x="147" y="207" font-size="12" fill="#173B70">状态/证据</text>
    <rect x="308" y="118" width="210" height="112" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="413" y="154" font-size="19" font-weight="700" fill="#7A4100">控制</text><text x="413" y="184" font-size="14" fill="#7A4100">决定与动作</text><text x="413" y="207" font-size="12" fill="#7A4100">状态/证据</text>
    <rect x="574" y="118" width="210" height="112" rx="16" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="679" y="154" font-size="19" font-weight="700" fill="#14532D">验证</text><text x="679" y="184" font-size="14" fill="#14532D">观察与判定</text><text x="679" y="207" font-size="12" fill="#14532D">状态/证据</text>
    <rect x="840" y="118" width="210" height="112" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><text x="945" y="154" font-size="19" font-weight="700" fill="#7F1D1D">边界</text><text x="945" y="184" font-size="14" fill="#7F1D1D">停止与升级</text><text x="945" y="207" font-size="12" fill="#7F1D1D">状态/证据</text>
  </g>
  <path d="M252 174 H288" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M518 174 H554" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M784 174 H820" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="42" y="270" width="1010" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/><text x="62" y="302" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#334155">阅读任务：沿四步检查输入、控制、验证与边界；颜色只是分组，文字和形状提供完整含义。</text>
  <text x="42" y="350" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">设计稿模板 v01｜替换文字前请检查长度、箭头间距、窄屏和文字替代。</text>
</svg>
