<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">工具调用失败卡</title><desc id="desc">把工具失败分为未授权、范围越界、参数错误和外部未知，分别采取拒绝、缩小范围、修正参数或保留未知。</desc><rect width="1200" height="340" rx="20" fill="#F8FAFC"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">失败发生在哪一闸门？先保留边界，再决定重试</text><g font-family="system-ui,sans-serif" font-size="15"><rect x="42" y="86" width="260" height="170" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="66" y="120" fill="#991B1B" font-weight="700">未授权</text><text x="66" y="151" fill="#0F172A">身份或批准缺失</text><text x="66" y="184" fill="#0F172A">拒绝，等待正确授权</text><rect x="322" y="86" width="260" height="170" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="346" y="120" fill="#92400E" font-weight="700">范围越界</text><text x="346" y="151" fill="#0F172A">对象 / 租户不匹配</text><text x="346" y="184" fill="#0F172A">缩小范围或升级审批</text><rect x="602" y="86" width="260" height="170" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="626" y="120" fill="#075985" font-weight="700">参数错误</text><text x="626" y="151" fill="#0F172A">格式或必填项错误</text><text x="626" y="184" fill="#0F172A">修正后重新过闸</text><rect x="882" y="86" width="276" height="170" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="906" y="120" fill="#5B21B6" font-weight="700">外部未知</text><text x="906" y="151" fill="#0F172A">超时 / 回执缺失</text><text x="906" y="184" fill="#0F172A">标记 UNKNOWN，先核对</text></g><text x="42" y="304" font-family="system-ui,sans-serif" font-size="14" fill="#475569">示意构造；不得把拒绝、未知或未执行显示成成功。</text></svg>
