<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">内容状态</title><desc id="desc">四个卡片表达空态、加载、成功和错误内容状态。教学构造，未验证。</desc><rect width="640" height="360" fill="#f8fafc"/><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="45" y="115" width="120" height="105" rx="10" fill="#e5e7eb"/><text x="105" y="170">空态</text><rect x="190" y="115" width="120" height="105" rx="10" fill="#dbeafe"/><text x="250" y="170">加载中</text><rect x="335" y="115" width="120" height="105" rx="10" fill="#dcfce7"/><text x="395" y="170">成功</text><rect x="480" y="115" width="120" height="105" rx="10" fill="#fee2e2"/><text x="540" y="170">错误</text></g><text x="28" y="42" font-size="24" font-weight="700" fill="#111827">内容状态 States</text><text x="28" y="72" font-size="16" fill="#6b7280">状态应可见、可理解、可行动</text><text x="430" y="38" font-size="14" fill="#b45309">教学构造 · 未验证</text></svg>