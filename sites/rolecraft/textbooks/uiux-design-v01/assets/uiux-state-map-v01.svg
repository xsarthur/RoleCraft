<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">灯塔学习工作台的 AI 查教材状态示意</title>
  <desc id="desc">从输入问题到澄清、检索中、结果、无匹配、来源失配和人工接管的教学状态图。线条表示可能的用户动作，不表示实际应用已经实现。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#6b6356"/></marker>
    <style>
      .box{fill:#fff;stroke:#8b7652;stroke-width:2;rx:14}
      .warn{fill:#fff7e5;stroke:#b87918;stroke-width:2;rx:14}
      .error{fill:#fff0ec;stroke:#a84927;stroke-width:2;rx:14}
      .ok{fill:#eff9f4;stroke:#0f6e56;stroke-width:2;rx:14}
      .text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#3d3929}
      .h{font-size:18px;font-weight:700}.p{font-size:14px}.small{font-size:12px;fill:#6b6356}
      .line{stroke:#6b6356;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="530" fill="#f9f7f3"/>
  <text x="40" y="42" class="text h">AI 查教材：任务状态和可恢复动作（教学静态示意）</text>
  <text x="40" y="68" class="text small">查询提交时保存 queryId 与页面上下文；取消只停止等待并忽略迟到响应。未连接真实服务。</text>

  <rect x="45" y="120" width="180" height="96" class="box"/>
  <text x="65" y="151" class="text h">输入问题</text>
  <text x="65" y="177" class="text p">保留原句与上下文</text>
  <text x="65" y="198" class="text small">提交 / 修改</text>

  <rect x="280" y="120" width="180" height="96" class="warn"/>
  <text x="300" y="151" class="text h">检索中</text>
  <text x="300" y="177" class="text p">可收起、继续阅读</text>
  <text x="300" y="198" class="text small">取消=忽略迟到结果</text>

  <rect x="515" y="95" width="200" height="108" class="ok"/>
  <text x="535" y="128" class="text h">带来源结果</text>
  <text x="535" y="154" class="text p">小节 / 摘录 / 版本</text>
  <text x="535" y="177" class="text small">阅读、查看出处、改问法</text>

  <rect x="515" y="235" width="200" height="108" class="warn"/>
  <text x="535" y="268" class="text h">低置信 / 澄清</text>
  <text x="535" y="294" class="text p">选择含义或补充条件</text>
  <text x="535" y="317" class="text small">不得直接显示肯定答案</text>

  <rect x="515" y="375" width="200" height="108" class="error"/>
  <text x="535" y="408" class="text h">无匹配 / 不可用</text>
  <text x="535" y="434" class="text p">换词、看目录、重试</text>
  <text x="535" y="457" class="text small">保留草稿和 queryId</text>

  <rect x="820" y="95" width="200" height="108" class="error"/>
  <text x="840" y="128" class="text h">来源失配</text>
  <text x="840" y="154" class="text p">显示核对失败事实</text>
  <text x="840" y="177" class="text small">返回目录 / 报告问题</text>

  <rect x="820" y="235" width="200" height="108" class="box"/>
  <text x="840" y="268" class="text h">人工接管</text>
  <text x="840" y="294" class="text p">说明上下文和等待</text>
  <text x="840" y="317" class="text small">可编辑、删除或退出</text>

  <rect x="820" y="375" width="200" height="108" class="box"/>
  <text x="840" y="408" class="text h">重新提交</text>
  <text x="840" y="434" class="text p">生成新 queryId</text>
  <text x="840" y="457" class="text small">防重复，不覆盖新问题</text>

  <path d="M225 168 L280 168" class="line"/>
  <path d="M460 150 L515 150" class="line"/>
  <path d="M460 180 C490 230 490 270 515 280" class="line"/>
  <path d="M460 195 C490 330 490 410 515 420" class="line"/>
  <path d="M715 150 L820 150" class="line"/>
  <path d="M715 280 L820 280" class="line"/>
  <path d="M715 430 L820 430" class="line"/>
  <path d="M615 235 C615 210 615 205 615 203" class="line"/>
  <path d="M820 330 C770 350 750 380 715 410" class="line"/>
  <path d="M920 375 C880 345 850 325 820 310" class="line"/>
  <path d="M920 235 C880 205 850 185 820 175" class="line"/>
  <text x="740" y="138" class="text small">核对失败</text>
  <text x="734" y="270" class="text small">转人工</text>
  <text x="736" y="420" class="text small">重试/改问</text>
  <text x="39" y="515" class="text small">作者设计稿 v0.1 · 颜色只作辅助，状态含文字和动作；需工程、键盘、读屏、缩放及真人任务测试复核。</text>
</svg>
