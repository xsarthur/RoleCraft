<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="va01-title va01-desc">
  <title id="va01-title">VA01 Critique Board — T-1042</title>
  <desc id="va01-desc">同一 T-1042 教学构造的三版批评板：A 不和谐、B 粗糙、C 修订。标注焦点、节奏、噪声与修订。教学构造/未验证。</desc>
  <rect width="1200" height="700" fill="#f5f7fb"/>
  <text x="56" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#17223b">T-1042 · 批评板</text>
  <text x="56" y="88" font-family="sans-serif" font-size="16" fill="#52617a">同一教学构造的视觉对照｜教学构造 / 未验证</text>
  <line x1="56" y1="112" x2="1144" y2="112" stroke="#ccd4e2"/>

  <!-- cards -->
  <g font-family="sans-serif">
    <rect x="56" y="140" width="340" height="478" rx="16" fill="#fff" stroke="#d9dfeb"/>
    <rect x="430" y="140" width="340" height="478" rx="16" fill="#fff" stroke="#d9dfeb"/>
    <rect x="804" y="140" width="340" height="478" rx="16" fill="#fff" stroke="#7c92d8" stroke-width="2"/>
    <text x="84" y="184" font-size="22" font-weight="700" fill="#a43a52">A · 不和谐</text>
    <text x="458" y="184" font-size="22" font-weight="700" fill="#ad6721">B · 粗糙</text>
    <text x="832" y="184" font-size="22" font-weight="700" fill="#3457a6">C · 修订</text>
    <!-- A composition -->
    <rect x="84" y="210" width="284" height="126" fill="#fff0f2" stroke="#efb5c0"/>
    <rect x="104" y="230" width="92" height="76" fill="#e46d7c"/>
    <rect x="216" y="226" width="132" height="12" fill="#7e3a4d"/>
    <rect x="216" y="252" width="96" height="10" fill="#d39aa5"/>
    <rect x="216" y="278" width="122" height="10" fill="#d39aa5"/>
    <path d="M94 354 C150 340, 190 386, 250 354 S340 364, 360 344" fill="none" stroke="#c02d55" stroke-width="7"/>
    <text x="84" y="390" font-size="15" fill="#a43a52">焦点：标题、图块争夺视线</text>
    <text x="84" y="416" font-size="15" fill="#a43a52">节奏：跳跃；噪声：装饰线</text>
    <line x1="84" y1="446" x2="350" y2="446" stroke="#efb5c0"/>
    <text x="84" y="480" font-size="14" fill="#52617a">批评提示</text>
    <text x="84" y="508" font-size="16" fill="#17223b">先找一个清晰入口</text>
    <text x="84" y="540" font-size="14" fill="#52617a">教学构造 / 未验证</text>
    <!-- B composition -->
    <rect x="458" y="210" width="284" height="126" fill="#fff7ec" stroke="#e8c28d"/>
    <rect x="478" y="230" width="244" height="14" fill="#c97a2f"/>
    <rect x="478" y="258" width="244" height="14" fill="#efd2ad"/>
    <rect x="478" y="286" width="72" height="30" fill="#d9954a"/>
    <rect x="562" y="286" width="72" height="30" fill="#d9954a"/>
    <rect x="646" y="286" width="72" height="30" fill="#d9954a"/>
    <text x="458" y="390" font-size="15" fill="#ad6721">焦点：没有层级；节奏：等距堆叠</text>
    <text x="458" y="416" font-size="15" fill="#ad6721">噪声：重复边框与占位块</text>
    <line x1="458" y1="446" x2="724" y2="446" stroke="#e8c28d"/>
    <text x="458" y="480" font-size="14" fill="#52617a">批评提示</text>
    <text x="458" y="508" font-size="16" fill="#17223b">删掉无效装饰，再定节拍</text>
    <text x="458" y="540" font-size="14" fill="#52617a">教学构造 / 未验证</text>
    <!-- C composition -->
    <rect x="832" y="210" width="284" height="126" fill="#eef3ff" stroke="#9db1e7"/>
    <rect x="852" y="230" width="180" height="18" rx="4" fill="#3457a6"/>
    <rect x="852" y="264" width="116" height="10" fill="#91a6d8"/>
    <rect x="852" y="286" width="220" height="10" fill="#c2cee9"/>
    <circle cx="1080" cy="239" r="18" fill="#7890cf"/>
    <path d="M850 316 H1090" stroke="#3457a6" stroke-width="3"/>
    <text x="832" y="390" font-size="15" fill="#3457a6">焦点：单一标题 → 操作；节奏：2 层</text>
    <text x="832" y="416" font-size="15" fill="#3457a6">噪声：移除；修订：保留反馈点</text>
    <line x1="832" y1="446" x2="1098" y2="446" stroke="#9db1e7"/>
    <text x="832" y="480" font-size="14" fill="#52617a">修订记录</text>
    <text x="832" y="508" font-size="16" fill="#17223b">入口聚焦 · 空间留白 · 反馈可见</text>
    <text x="832" y="540" font-size="14" fill="#52617a">教学构造 / 未验证</text>
  </g>
  <text x="56" y="662" font-family="sans-serif" font-size="14" fill="#6c7890">使用方式：从 A/B 的观察词，迁移到 C 的可验证修订假设。</text>
</svg>
