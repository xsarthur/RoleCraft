<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">四类判断四象限</title>
  <desc id="desc">教学构造／未验证：按证据强度与行动影响区分事实、推断、假设和待验证。</desc>
  <rect width="960" height="620" fill="#f7fafc"/>
  <text x="48" y="56" font-family="sans-serif" font-size="26" font-weight="700" fill="#17324d">判断分类：证据强度 × 行动影响</text>
  <text x="48" y="86" font-family="sans-serif" font-size="15" fill="#66788a">教学构造／未验证</text>
  <g transform="translate(180 135)">
    <rect x="0" y="0" width="330" height="190" fill="#eaf7f0" stroke="#2f7d57" stroke-width="2"/>
    <rect x="330" y="0" width="330" height="190" fill="#fff4df" stroke="#a46b00" stroke-width="2"/>
    <rect x="0" y="190" width="330" height="190" fill="#e7f1fb" stroke="#245b8f" stroke-width="2"/>
    <rect x="330" y="190" width="330" height="190" fill="#f4eafb" stroke="#73469a" stroke-width="2"/>
    <g font-family="sans-serif" text-anchor="middle" fill="#17324d">
      <text x="165" y="70" font-size="24" font-weight="700">事实</text><text x="165" y="105" font-size="16">证据充分 · 影响高</text><text x="165" y="140" font-size="14">可直接引用并行动</text>
      <text x="495" y="70" font-size="24" font-weight="700">推断</text><text x="495" y="105" font-size="16">证据部分 · 影响高</text><text x="495" y="140" font-size="14">标明依据与不确定性</text>
      <text x="165" y="260" font-size="24" font-weight="700">待验证</text><text x="165" y="295" font-size="16">证据不足 · 影响低</text><text x="165" y="330" font-size="14">记录缺口，安排检查</text>
      <text x="495" y="260" font-size="24" font-weight="700">假设</text><text x="495" y="295" font-size="16">证据不足 · 影响高</text><text x="495" y="330" font-size="14">先隔离，禁止当成事实</text>
    </g>
  </g>
  <text x="510" y="565" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#526779">证据强度 →</text>
  <text x="92" y="330" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#526779" transform="rotate(-90 92 330)">行动影响 →</text>
</svg>
