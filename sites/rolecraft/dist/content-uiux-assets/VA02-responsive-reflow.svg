<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">响应式重排</title><desc id="desc">教学构造／未验证：展示桌面、760px 和窄屏布局如何从多列重排为单列。</desc><rect width="960" height="560" fill="#f7fafc"/><text x="40" y="50" font-family="sans-serif" font-size="26" font-weight="700" fill="#17324d">响应式重排</text><text x="40" y="80" font-family="sans-serif" font-size="15" fill="#66788a">教学构造／未验证</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="125" width="370" height="300" rx="18" fill="#fff" stroke="#245b8f" stroke-width="3"/><text x="240" y="160" font-size="20" fill="#17324d">桌面</text><rect x="90" y="190" width="140" height="90" fill="#e7f1fb"/><rect x="250" y="190" width="140" height="90" fill="#eaf7f0"/><rect x="90" y="300" width="300" height="70" fill="#fff4df"/><rect x="470" y="125" width="220" height="300" rx="18" fill="#fff" stroke="#2f7d57" stroke-width="3"/><text x="580" y="160" font-size="20" fill="#17324d">760px</text><rect x="500" y="190" width="160" height="70" fill="#e7f1fb"/><rect x="500" y="275" width="160" height="70" fill="#eaf7f0"/><rect x="735" y="125" width="150" height="300" rx="18" fill="#fff" stroke="#73469a" stroke-width="3"/><text x="810" y="160" font-size="20" fill="#17324d">窄屏</text><rect x="760" y="190" width="100" height="55" fill="#e7f1fb"/><rect x="760" y="260" width="100" height="55" fill="#eaf7f0"/><rect x="760" y="330" width="100" height="55" fill="#fff4df"/></g><text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#526779">列 → 堆叠 → 单列；保留优先级和可读性</text></svg>
