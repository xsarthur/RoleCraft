<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 260" role="img" aria-labelledby="t d"><title id="t">发布回退时保住在途任务事实：阅读总览</title><desc id="d">冻结版本 → 验证兼容 → 分流任务 → 观测 → 回退或恢复。颜色辅助区分起点、处理中间步骤和结论。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="42" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">发布回退时保住在途任务事实</text><text x="32" y="73" font-family="sans-serif" font-size="14" fill="#475569">先看证据推进，再阅读正文中的机制与失败分支</text><rect x="70" y="120" width="170" height="74" rx="14" fill="#be123c" stroke="#334155" stroke-width="2"/><text x="155" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">冻结版本</text><path d="M240 157 H280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="120" width="170" height="74" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="375" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">验证兼容</text><path d="M460 157 H500" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="120" width="170" height="74" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="595" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">分流任务</text><path d="M680 157 H720" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="120" width="170" height="74" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="815" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">观测</text><path d="M900 157 H940" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="950" y="120" width="170" height="74" rx="14" fill="#be123c" stroke="#334155" stroke-width="2"/><text x="1035" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">回退或恢复</text><text x="32" y="235" font-family="sans-serif" font-size="13" fill="#475569">图示为教学结构；具体执行状态以本章记录和独立验证为准。</text></svg>