<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 636" role="img" aria-labelledby="t d">
<title id="t">发布回退时保住在途任务事实：阅读总览（窄屏纵栈）</title>
<desc id="d">冻结版本 → 验证兼容 → 分流任务 → 观测 → 回退或恢复。颜色辅助区分起点、处理中间步骤和结论。箭头完全落在节点间距内，不被节点遮盖。 窄屏一列一主节点，自上而下推进。</desc>
<defs>
  <marker id="arrow-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="34" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">发布回退时保住在途任务事实</text>
<text x="24" y="56" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" fill="#475569">先看证据推进，再阅读正文机制与失败分支</text>
<rect x="40" y="80" width="320" height="64" rx="14" fill="#be123c" stroke="#334155" stroke-width="2"/>
<text x="64" y="118" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffe4e6">1</text>
<text x="200" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">冻结版本</text>
<rect x="40" y="188" width="320" height="64" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="64" y="226" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">2</text>
<text x="200" y="228" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">验证兼容</text>
<rect x="40" y="296" width="320" height="64" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="64" y="334" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">3</text>
<text x="200" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">分流任务</text>
<rect x="40" y="404" width="320" height="64" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
<text x="64" y="442" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">4</text>
<text x="200" y="444" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">观测</text>
<rect x="40" y="512" width="320" height="64" rx="14" fill="#be123c" stroke="#334155" stroke-width="2"/>
<text x="64" y="550" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffe4e6">5</text>
<text x="200" y="552" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">回退或恢复</text>
<line x1="200" y1="148" x2="200" y2="180" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-n)"/>
<line x1="200" y1="256" x2="200" y2="288" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-n)"/>
<line x1="200" y1="364" x2="200" y2="396" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-n)"/>
<line x1="200" y1="472" x2="200" y2="504" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-n)"/>
<text x="24" y="616" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" fill="#475569">图示为教学结构；执行状态以本章记录与独立验证为准。</text>
</svg>
