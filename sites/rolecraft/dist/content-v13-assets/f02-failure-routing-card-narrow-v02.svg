<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" role="img" aria-labelledby="title desc">
<title id="title">模型候选失败分流（窄屏纵栈）</title>
<desc id="desc">完整候选、事实错位、响应未完成和信息缺失分别进入保存、拒绝、停止和等待。窄屏一列一去向。</desc>
<defs><marker id="arr-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="32" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">四种响应，四种去向</text>
<text x="24" y="54" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">完整→错位→未完成→缺失 · 纵栈</text>
<rect x="36" y="80" width="328" height="88" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="200" y="114" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#174b2b">1 完整且一致</text>
<text x="200" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#174b2b">保存候选</text>
<rect x="36" y="198" width="328" height="88" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/>
<text x="200" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#742a2a">2 事实错位</text>
<text x="200" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#742a2a">拒绝并记录差异</text>
<rect x="36" y="316" width="328" height="88" rx="14" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/>
<text x="200" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f2a61">3 未完成/拒绝</text>
<text x="200" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#3f2a61">停止消费</text>
<rect x="36" y="434" width="328" height="88" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="200" y="468" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f370e">4 规则或证据缺失</text>
<text x="200" y="496" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#5f370e">WAIT_INPUT</text>
<line x1="200" y1="172" x2="200" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="290" x2="200" y2="308" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="408" x2="200" y2="426" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<text x="24" y="566" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#64748b">设计稿 narrow-v02｜教学构造</text>
</svg>
