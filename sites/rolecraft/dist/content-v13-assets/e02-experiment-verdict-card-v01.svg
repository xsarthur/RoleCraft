<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">版本实验如何保留分组并拒绝缺证通过</title>
  <desc id="desc">先冻结案例分组和成功定义，再让旧版与新版对同一案例配对运行并保留超时和缺失轨迹。判定器区分 PASS、FAIL、INSUFFICIENT 和 HARNESS_ERROR，缺证不进入通过分子。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs>
  <rect width="1080" height="380" fill="#FAFAF9"/>
  <text x="40" y="38" font-size="25" font-weight="700" fill="#1F2937">同一案例配对运行，缺证保留在分母里</text>
  <text x="40" y="66" font-size="15" fill="#475569">比较“被分配的一次运行”，不是只比较成功返回的请求。</text>
  <rect x="42" y="102" width="185" height="92" rx="15" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/><text x="134" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">冻结案例集</text><text x="134" y="155" text-anchor="middle" font-size="13" fill="#334155">正常 / 缺证 / 恢复</text><text x="134" y="177" text-anchor="middle" font-size="13" fill="#334155">成功定义 + 重复次数</text>
  <path d="M227 148 H282" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="286" y="96" width="300" height="105" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="436" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">共同案例的配对运行</text><rect x="312" y="143" width="112" height="34" rx="9" fill="#F1F5F9" stroke="#94A3B8"/><text x="368" y="165" text-anchor="middle" font-size="13" fill="#334155">旧版 × n</text><rect x="448" y="143" width="112" height="34" rx="9" fill="#F1F5F9" stroke="#94A3B8"/><text x="504" y="165" text-anchor="middle" font-size="13" fill="#334155">新版 × n</text>
  <path d="M586 148 H641" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="645" y="94" width="185" height="110" rx="15" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="737" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4100">完整记录</text><text x="737" y="147" text-anchor="middle" font-size="13" fill="#7A4100">版本 / 输入 / 预算</text><text x="737" y="169" text-anchor="middle" font-size="13" fill="#7A4100">超时 / 轨迹 / 理由</text><text x="737" y="191" text-anchor="middle" font-size="13" fill="#7A4100">缺失不删除</text>
  <path d="M830 148 H875" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="879" y="88" width="150" height="232" rx="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="954" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">判定器</text>
  <rect x="898" y="132" width="112" height="32" rx="8" fill="#E9F8EF" stroke="#15803D"/><text x="954" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">PASS</text>
  <rect x="898" y="172" width="112" height="32" rx="8" fill="#FDECEC" stroke="#DC2626"/><text x="954" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">FAIL</text>
  <rect x="898" y="212" width="112" height="32" rx="8" fill="#FFF7DB" stroke="#D97706"/><text x="954" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#7A4100">INSUFFICIENT</text>
  <rect x="898" y="252" width="112" height="32" rx="8" fill="#F1F5F9" stroke="#64748B"/><text x="954" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">HARNESS_ERROR</text>
  <path d="M830 190 C848 212 858 228 875 228" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="42" y="260" font-size="15" font-weight="700" fill="#334155">结论边界</text><text x="42" y="286" font-size="13" fill="#475569">缺证、评估故障、超时和未决外部效果不能进入通过分子。</text><text x="42" y="309" font-size="13" fill="#475569">总通过次数增加，只支持“这些分配中观察到增加”；不能冲掉关键安全反证。</text>
  <text x="42" y="348" font-size="12" fill="#64748B">颜色与文字同时编码状态；示意数字为教学构造，未做真实模型或行业效果结论。</text>
</svg>
