<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">外部 API 四道边界</title>
<desc id="desc">输入校验、授权、响应和业务一致性依次通过，失败则拒绝或保留未知。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="40" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">外部请求：先过边界，再形成证据</text>
<rect x="30" y="90" width="200" height="130" rx="16" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
<text x="130.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">1 输入</text>
<text x="130.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#17324d">类型、字段、范围</text>
<text x="130.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#17324d">不合格：拒绝</text>
<rect x="270" y="90" width="200" height="130" rx="16" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="370.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#5f370e">2 授权</text>
<text x="370.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#5f370e">身份与资源范围</text>
<text x="370.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#5f370e">不合格：拒绝</text>
<rect x="510" y="90" width="200" height="130" rx="16" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/>
<text x="610.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#3f2a61">3 响应</text>
<text x="610.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#3f2a61">状态、大小、协议</text>
<text x="610.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#3f2a61">超时：未知</text>
<rect x="750" y="90" width="200" height="130" rx="16" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="850.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#174b2b">4 业务一致性</text>
<text x="850.0" y="160" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#174b2b">对象、版本、哈希</text>
<text x="850.0" y="188" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#174b2b">通过：可引用</text>
<line x1="230" y1="155.0" x2="262" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<line x1="470" y1="155.0" x2="502" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<line x1="710" y1="155.0" x2="742" y2="155.0" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<text x="500" y="270" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" fill="#475569">颜色辅助分层；每个状态由文字和位置共同表达。教学构造，未验证真实服务。</text>
<text x="30" y="300" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#64748b">设计稿 v02｜窄屏见 *-narrow-v02</text>
</svg>
