<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 190" role="img" aria-labelledby="t d">
<title id="t">写工具</title>
<desc id="d">提议 → 授权 → 去重 → 发送 → 效果核对。箭头完全落在节点间距内，不被节点遮盖。</desc>
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="30" y="32" font-size="24" font-weight="700" font-family="Arial, sans-serif" fill="#162033">写工具</text>
<!-- nodes first (paint under arrows) -->
<rect x="30" y="62" width="210" height="70" rx="14" fill="#e8f1ff" stroke="#334155" stroke-width="2"/>
<text x="135" y="103" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#172033">提议</text>
<rect x="290" y="62" width="210" height="70" rx="14" fill="#fff3d6" stroke="#334155" stroke-width="2"/>
<text x="395" y="103" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#172033">授权</text>
<rect x="550" y="62" width="210" height="70" rx="14" fill="#e8f7ef" stroke="#334155" stroke-width="2"/>
<text x="655" y="103" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#172033">去重</text>
<rect x="810" y="62" width="210" height="70" rx="14" fill="#fde8e8" stroke="#334155" stroke-width="2"/>
<text x="915" y="103" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#172033">发送</text>
<rect x="1070" y="62" width="210" height="70" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/>
<text x="1175" y="103" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#172033">效果核对</text>
<!-- arrows last; fully inside gap gutters; x2 &lt; next.left -->
<line x1="248" y1="97" x2="282" y2="97" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<line x1="508" y1="97" x2="542" y2="97" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<line x1="768" y1="97" x2="802" y2="97" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<line x1="1028" y1="97" x2="1062" y2="97" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
</svg>
