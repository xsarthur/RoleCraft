<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><title>模型响应四层闸门</title><desc>模型响应依次经过协议、结构、事实和引用校验，形成候选或拒绝。</desc><rect width="1200" height="300" fill="#f8fafc"/><text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#17324d">模型响应不是答案：四层闸门</text><g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="40" y="90" width="220" height="120" rx="16" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/><text x="150" y="130">协议完成</text><text x="150" y="160">状态、拒绝、截断</text><text x="150" y="188">不完整：停止</text><rect x="330" y="90" width="220" height="120" rx="16" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="440" y="130">结构可解析</text><text x="440" y="160">字段、类型、Schema</text><text x="440" y="188">错误：拒绝</text><rect x="620" y="90" width="220" height="120" rx="16" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/><text x="730" y="130">事实一致</text><text x="730" y="160">报告、修订、证据</text><text x="730" y="188">错位：拒绝</text><rect x="910" y="90" width="220" height="120" rx="16" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="1020" y="130">候选保存</text><text x="1020" y="160">等待业务核证</text><text x="1020" y="188">不获得写权</text></g><g stroke="#64748b" stroke-width="3"><path d="M260 150h60"/><path d="M550 150h60"/><path d="M840 150h60"/></g><g fill="#64748b"><path d="M320 150l-12-8v16z"/><path d="M610 150l-12-8v16z"/><path d="M900 150l-12-8v16z"/></g></svg>