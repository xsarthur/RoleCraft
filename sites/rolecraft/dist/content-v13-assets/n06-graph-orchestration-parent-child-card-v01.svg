<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">父图与子图如何按事件顺序交接</title>
  <desc id="desc">父图并行读取报告和源码，汇合后把必要字段投影给子图审阅；子图只返回摘要，父图暂停等待批准，再按批准或拒绝分支结束。下方事件序列强调节点更新不等于最终成功。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs>
  <rect width="1080" height="420" fill="#FAFAF9"/>
  <text x="40" y="38" font-size="25" font-weight="700" fill="#1F2937">父图把控制权留在运行时，子图只交回有界摘要</text>
  <text x="40" y="66" font-size="15" fill="#475569">先并行读取，再投影必要字段；事件顺序可重放，工具开始不等于最终成功。</text>
  <rect x="35" y="88" width="1010" height="204" rx="18" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/>
  <text x="55" y="116" font-size="15" font-weight="700" fill="#1E40AF">父图：状态所有者与批准者</text>
  <rect x="62" y="140" width="160" height="62" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="142" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">read_report</text><text x="142" y="187" text-anchor="middle" font-size="13" fill="#475569">来源/版本</text>
  <rect x="62" y="218" width="160" height="52" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="142" y="241" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">read_source</text><text x="142" y="259" text-anchor="middle" font-size="13" fill="#475569">代码/事实</text>
  <path d="M222 170 H278" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M222 244 H278" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="282" y="181" width="150" height="70" rx="12" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="357" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4100">merge_findings</text><text x="357" y="230" text-anchor="middle" font-size="13" fill="#7A4100">冲突即停止</text>
  <path d="M432 216 H482" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="486" y="142" width="220" height="146" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="596" y="169" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">子图 review</text><text x="596" y="194" text-anchor="middle" font-size="13" fill="#6B21A8">输入：evidence 投影</text><text x="596" y="216" text-anchor="middle" font-size="13" fill="#6B21A8">输出：summary</text><text x="596" y="244" text-anchor="middle" font-size="12" fill="#7C3AED">不覆盖 request_id / approved</text>
  <path d="M706 216 H756" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="760" y="181" width="120" height="70" rx="12" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="820" y="209" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4100">interrupt</text><text x="820" y="230" text-anchor="middle" font-size="13" fill="#7A4100">等待批准</text>
  <path d="M880 199 H923" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M880 235 C920 265 958 265 970 246" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="928" y="150" width="98" height="42" rx="10" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="977" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">approved</text>
  <rect x="928" y="220" width="98" height="42" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/><text x="977" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">stopped</text>
  <text x="40" y="326" font-size="15" font-weight="700" fill="#334155">事件顺序（可核对的最小封套）</text>
  <g font-size="13" text-anchor="middle"><rect x="55" y="345" width="150" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8"/><text x="130" y="371" fill="#334155">1 node_update</text><path d="M205 366 H245" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="345" width="150" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8"/><text x="325" y="371" fill="#334155">2 child_summary</text><path d="M400 366 H440" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="445" y="345" width="150" height="42" rx="10" fill="#FFF7DB" stroke="#D97706"/><text x="520" y="371" fill="#7A4100">3 approval_wait</text><path d="M595 366 H635" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="640" y="345" width="150" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8"/><text x="715" y="371" fill="#334155">4 final / stop</text></g>
  <text x="820" y="371" font-size="12" fill="#64748B">示意；未验证浏览器流式重连</text>
</svg>
