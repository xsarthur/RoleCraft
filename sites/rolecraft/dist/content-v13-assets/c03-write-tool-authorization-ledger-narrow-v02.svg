<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 632" role="img" aria-labelledby="t d">
<title id="t">写工具（窄屏纵栈）</title>
<desc id="d">提议 → 授权 → 去重 → 发送 → 效果核对。窄屏一列一主节点，自上而下推进。箭头完全落在节点间距内，不被节点遮盖。</desc>
<defs>
  <marker id="ac03-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<!-- title -->
<text x="24" y="34" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">写工具</text>
<text x="24" y="56" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" fill="#475569">提议 → 授权 → 去重 → 发送 → 效果核对</text>
<!-- nodes first; column x=40 w=320; node h=64; vertical gutter=44 -->
<!-- 1 提议 y=80 -->
<rect x="40" y="80" width="320" height="64" rx="14" fill="#e8f1ff" stroke="#334155" stroke-width="2"/>
<text x="64" y="118" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">1</text>
<text x="200" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">提议</text>
<!-- 2 授权 y=188 -->
<rect x="40" y="188" width="320" height="64" rx="14" fill="#fff3d6" stroke="#334155" stroke-width="2"/>
<text x="64" y="226" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">2</text>
<text x="200" y="228" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">授权</text>
<!-- 3 去重 y=296 -->
<rect x="40" y="296" width="320" height="64" rx="14" fill="#e8f7ef" stroke="#334155" stroke-width="2"/>
<text x="64" y="334" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">3</text>
<text x="200" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">去重</text>
<!-- 4 发送 y=404 -->
<rect x="40" y="404" width="320" height="64" rx="14" fill="#fde8e8" stroke="#334155" stroke-width="2"/>
<text x="64" y="442" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">4</text>
<text x="200" y="444" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">发送</text>
<!-- 5 效果核对 y=512 -->
<rect x="40" y="512" width="320" height="64" rx="14" fill="#f3e8ff" stroke="#334155" stroke-width="2"/>
<text x="64" y="550" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">5</text>
<text x="200" y="552" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">效果核对</text>
<!-- arrows last; vertical gutters; y2 = next.top - 8 -->
<line x1="200" y1="148" x2="200" y2="180" stroke="#64748b" stroke-width="3" marker-end="url(#ac03-n)"/>
<line x1="200" y1="256" x2="200" y2="288" stroke="#64748b" stroke-width="3" marker-end="url(#ac03-n)"/>
<line x1="200" y1="364" x2="200" y2="396" stroke="#64748b" stroke-width="3" marker-end="url(#ac03-n)"/>
<line x1="200" y1="472" x2="200" y2="504" stroke="#64748b" stroke-width="3" marker-end="url(#ac03-n)"/>
<text x="24" y="612" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="11" fill="#475569">图示为教学结构；执行状态以本章记录与独立验证为准。</text>
</svg>
