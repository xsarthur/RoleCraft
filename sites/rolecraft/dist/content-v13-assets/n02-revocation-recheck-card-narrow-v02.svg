<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" role="img" aria-labelledby="title desc">
<title id="title">记忆来源失效与依赖复核（窄屏纵栈）</title>
<desc id="desc">撤回来源后，记忆、产物和动作依次进入复核队列，重新取证并生成新版本。窄屏一列一步。</desc>
<defs><marker id="arr-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="32" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">撤回不是改一句文本</text>
<text x="24" y="54" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">来源撤回→依赖→冻结→取证 · 纵栈</text>
<rect x="36" y="80" width="328" height="88" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/>
<text x="200" y="114" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#742a2a">1 来源撤回</text>
<text x="200" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#742a2a">禁止继续使用</text>
<rect x="36" y="198" width="328" height="88" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="200" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f370e">2 依赖传播</text>
<text x="200" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#5f370e">requires_recheck</text>
<rect x="36" y="316" width="328" height="88" rx="14" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/>
<text x="200" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f2a61">3 冻结动作</text>
<text x="200" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#3f2a61">保留未知效果</text>
<rect x="36" y="434" width="328" height="88" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="200" y="468" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#174b2b">4 重新取证</text>
<text x="200" y="496" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#174b2b">生成新版本</text>
<line x1="200" y1="172" x2="200" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="290" x2="200" y2="308" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="408" x2="200" y2="426" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<text x="24" y="566" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#64748b">设计稿 narrow-v02｜教学构造</text>
</svg>
