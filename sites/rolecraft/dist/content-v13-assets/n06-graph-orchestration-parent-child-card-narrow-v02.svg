<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 792" role="img" aria-labelledby="title desc">
<title id="title">父图与子图如何按事件顺序交接（窄屏）</title>
<desc id="desc">父图控制权留在运行时；子图交回有界摘要。窄屏纵栈 + 事件序。</desc>
<defs><marker id="arr-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFAF9"/>
<text x="24" y="30" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">父图控制 · 子图有界摘要</text>
<text x="24" y="52" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">事件可重放 · 工具开始≠最终成功</text>
<rect x="36" y="80" width="328" height="80" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="54" y="108" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">1</text>
<text x="200" y="110" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">并行读取</text>
<text x="200" y="136" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#1E3A8A">read_report + read_source</text>
<rect x="36" y="188" width="328" height="80" rx="14" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/>
<text x="54" y="216" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#7A4100">2</text>
<text x="200" y="218" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A4100">merge_findings</text>
<text x="200" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#7A4100">冲突即停止</text>
<rect x="36" y="296" width="328" height="80" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="54" y="324" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">3</text>
<text x="200" y="326" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#5B21B6">子图 review</text>
<text x="200" y="352" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#5B21B6">投影 in → summary out</text>
<rect x="36" y="404" width="328" height="80" rx="14" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/>
<text x="54" y="432" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#7A4100">4</text>
<text x="200" y="434" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A4100">interrupt</text>
<text x="200" y="460" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#7A4100">等待批准</text>
<rect x="36" y="512" width="328" height="80" rx="14" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/>
<text x="54" y="540" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#14532D">5</text>
<text x="200" y="542" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#14532D">approved / stopped</text>
<text x="200" y="568" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#14532D">分支结束</text>
<line x1="200" y1="164" x2="200" y2="180" stroke="#64748B" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="272" x2="200" y2="288" stroke="#64748B" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="380" x2="200" y2="396" stroke="#64748B" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="488" x2="200" y2="504" stroke="#64748B" stroke-width="3" marker-end="url(#arr-n)"/>
<text x="24" y="632" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">事件顺序</text>
<rect x="36" y="648" width="328" height="24" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="200" y="665" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#334155">1 node_update</text>
<rect x="36" y="676" width="328" height="24" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="200" y="693" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#334155">2 child_summary</text>
<rect x="36" y="704" width="328" height="24" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="200" y="721" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#334155">3 approval_wait</text>
<rect x="36" y="732" width="328" height="24" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
<text x="200" y="749" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#334155">4 final / stop</text>
<text x="24" y="778" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" fill="#64748B">设计稿 narrow-v02｜示意</text>
</svg>
