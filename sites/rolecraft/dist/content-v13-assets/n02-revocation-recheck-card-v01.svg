<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="250" viewBox="0 0 1050 250"><title>记忆来源失效与依赖复核</title><desc>撤回来源后，记忆、产物和动作依次进入复核队列，重新取证并生成新版本。</desc><rect width="1050" height="250" fill="#fff"/><text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">撤回不是改一句文本</text><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="40" y="75" width="200" height="100" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/><text x="140" y="112">来源撤回</text><text x="140" y="142">禁止继续使用</text><rect x="285" y="75" width="200" height="100" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="385" y="112">依赖传播</text><text x="385" y="142">requires_recheck</text><rect x="530" y="75" width="200" height="100" rx="14" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/><text x="630" y="112">冻结动作</text><text x="630" y="142">保留未知效果</text><rect x="775" y="75" width="235" height="100" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="892" y="112">重新取证</text><text x="892" y="142">创建新版本</text></g><g stroke="#64748b" stroke-width="3"><path d="M240 125h35"/><path d="M485 125h35"/><path d="M730 125h35"/></g><g fill="#64748b"><path d="M275 125l-10-7v14z"/><path d="M520 125l-10-7v14z"/><path d="M765 125l-10-7v14z"/></g></svg>