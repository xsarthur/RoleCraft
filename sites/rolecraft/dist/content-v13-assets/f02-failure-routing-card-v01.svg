<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="250" viewBox="0 0 1050 250"><title>模型候选失败分流</title><desc>完整候选、事实错位、响应未完成和信息缺失分别进入保存、拒绝、停止和等待。</desc><rect width="1050" height="250" fill="#fff"/><text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">四种响应，四种去向</text><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="40" y="75" width="210" height="100" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="145" y="112">完整且一致</text><text x="145" y="142">保存候选</text><rect x="285" y="75" width="210" height="100" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/><text x="390" y="112">事实错位</text><text x="390" y="142">拒绝并记录差异</text><rect x="530" y="75" width="210" height="100" rx="14" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/><text x="635" y="112">未完成/拒绝</text><text x="635" y="142">停止消费</text><rect x="775" y="75" width="235" height="100" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="892" y="112">规则或证据缺失</text><text x="892" y="142">WAIT_INPUT</text></g><g stroke="#64748b" stroke-width="3"><path d="M250 125h30"/><path d="M495 125h30"/><path d="M740 125h30"/></g><g fill="#64748b"><path d="M280 125l-10-7v14z"/><path d="M525 125l-10-7v14z"/><path d="M770 125l-10-7v14z"/></g></svg>