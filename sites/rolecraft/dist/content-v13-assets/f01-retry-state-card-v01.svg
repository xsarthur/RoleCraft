<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240"><title>请求状态与重试边界</title><desc>请求前拒绝，请求后区分确认成功、临时不可用和未知效果；未知不能直接重发。</desc><rect width="1000" height="240" fill="#fff"/><text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#17324d">状态先于重试</text><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="40" y="75" width="200" height="90" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="140" y="110" fill="#5f370e">请求前</text><text x="140" y="138" fill="#5f370e">拒绝或放行</text><rect x="290" y="75" width="200" height="90" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="390" y="110" fill="#174b2b">已确认成功</text><text x="390" y="138" fill="#174b2b">结束并引用</text><rect x="540" y="75" width="200" height="90" rx="14" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/><text x="640" y="110" fill="#17324d">临时不可用</text><text x="640" y="138" fill="#17324d">按合同有限重试</text><rect x="790" y="75" width="170" height="90" rx="14" fill="#fde8e8" stroke="#c53030" stroke-width="2"/><text x="875" y="110" fill="#742a2a">效果未知</text><text x="875" y="138" fill="#742a2a">先核原操作</text></g><g stroke="#64748b" stroke-width="3" fill="none"><path d="M240 120h45"/><path d="M490 120h45"/><path d="M740 120h45"/></g><g fill="#64748b"><path d="M285 120l-10-7v14z"/><path d="M535 120l-10-7v14z"/><path d="M785 120l-10-7v14z"/></g></svg>