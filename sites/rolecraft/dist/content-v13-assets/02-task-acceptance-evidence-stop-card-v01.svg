<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">三类证据与合理停止</title>
<desc id="desc">中段卡片：产物证据说明内容是否有依据，过程证据说明授权与实际操作，效果证据说明业务结果是否确认。证据不足时分别进入缺证停止、缺批准等待或效果未知等待。</desc>
<defs><style>.t{font:700 30px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#182230}.h{font:700 21px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#182230}.b{font:600 17px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#182230}.s{font:500 15px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#526174}.line{stroke:#3c6e9e;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3c6e9e"/></marker></defs>
<rect width="1100" height="520" fill="#f6f8fb"/><rect x="24" y="24" width="1052" height="472" rx="20" fill="#fff" stroke="#d5dee8" stroke-width="2"/>
<text x="58" y="66" class="t">完成判断要看三类证据</text><text x="58" y="94" class="s">中段复盘卡：证据不齐时，停止或等待本身可以是正确结果。</text>
<g><rect x="58" y="132" width="292" height="190" rx="16" fill="#eaf3fb" stroke="#9dc1dd" stroke-width="2"/><text x="204" y="170" text-anchor="middle" class="h">产物证据</text><text x="86" y="210" class="b">事实与推断分开</text><text x="86" y="240" class="b">引用可回读同一修订</text><text x="86" y="282" class="s">回答：写出来的内容有依据吗？</text>
<rect x="404" y="132" width="292" height="190" rx="16" fill="#fff8df" stroke="#e7c45d" stroke-width="2"/><text x="550" y="170" text-anchor="middle" class="h">过程证据</text><text x="432" y="210" class="b">授权与准确批准</text><text x="432" y="240" class="b">实际读取、发送可核对</text><text x="432" y="282" class="s">回答：过程按边界发生了吗？</text>
<rect x="750" y="132" width="292" height="190" rx="16" fill="#eef8f4" stroke="#9dcbb7" stroke-width="2"/><text x="896" y="170" text-anchor="middle" class="h">效果证据</text><text x="778" y="210" class="b">服务确认唯一对应意图</text><text x="778" y="240" class="b">未知效果已经核对</text><text x="778" y="282" class="s">回答：业务结果真的确认了吗？</text></g>
<path d="M204 332V358" class="line"/><path d="M550 332V358" class="line"/><path d="M896 332V358" class="line"/>
<rect x="58" y="374" width="292" height="76" rx="14" fill="#fff3ec" stroke="#e8b28d" stroke-width="2"/><text x="204" y="405" text-anchor="middle" class="h">缺证停止</text><text x="204" y="430" text-anchor="middle" class="s">列出缺项，停止写入</text>
<rect x="404" y="374" width="292" height="76" rx="14" fill="#f5f1fb" stroke="#c4b1df" stroke-width="2"/><text x="550" y="405" text-anchor="middle" class="h">缺批准等待</text><text x="550" y="430" text-anchor="middle" class="s">保留候选，不代替审批</text>
<rect x="750" y="374" width="292" height="76" rx="14" fill="#fff0f0" stroke="#db9a9a" stroke-width="2"/><text x="896" y="405" text-anchor="middle" class="h">效果未知等待</text><text x="896" y="430" text-anchor="middle" class="s">核对原操作，不能重复创建</text>
<text x="58" y="475" class="s">来源：v12/02-task-acceptance.md　｜　静态卡片，未验证浏览器渲染、窄屏布局与真人理解。</text>
</svg>
