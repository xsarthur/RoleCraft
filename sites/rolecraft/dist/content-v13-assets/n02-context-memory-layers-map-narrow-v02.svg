<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 582" role="img" aria-labelledby="title desc">
<title id="title">上下文与记忆四层模型（窄屏纵栈）</title>
<desc id="desc">会话历史、权威任务状态、当轮上下文投影和长期记忆各自保存不同对象。 窄屏一列一层。</desc>
<defs><marker id="arr-n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="24" y="32" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">四种保存对象</text>
<text x="24" y="54" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#475569">历史→状态→投影→长期 · 纵栈</text>
<rect x="36" y="80" width="328" height="88" rx="14" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/>
<text x="200" y="114" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">1 会话历史</text>
<text x="200" y="142" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#17324d">消息与引用 · 追溯</text>
<rect x="36" y="198" width="328" height="88" rx="14" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/>
<text x="200" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f370e">2 权威任务状态</text>
<text x="200" y="260" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#5f370e">目标、版本、账本 · 恢复</text>
<rect x="36" y="316" width="328" height="88" rx="14" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/>
<text x="200" y="350" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f2a61">3 当轮上下文</text>
<text x="200" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#3f2a61">有限证据投影 · 每轮重建</text>
<rect x="36" y="434" width="328" height="88" rx="14" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="200" y="468" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#174b2b">4 长期记忆</text>
<text x="200" y="496" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#174b2b">已筛选、可纠正 · 跨轮复用</text>
<line x1="200" y1="172" x2="200" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="290" x2="200" y2="308" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<line x1="200" y1="408" x2="200" y2="426" stroke="#64748b" stroke-width="3" marker-end="url(#arr-n)"/>
<text x="24" y="566" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="13" fill="#64748b">设计稿 narrow-v02｜教学构造</text>
</svg>
