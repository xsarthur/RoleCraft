<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">多 Agent 责任交接与缺席传播</title>
<desc id="desc">协调者把带有目标、禁止动作、对象版本和证据要求的子任务交给两个 Agent；每个 Agent返回带来源、版本和限制的主张，协调者检查后再汇总。缺失或冲突不会被包装成已完成。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFAF9"/>
<text x="28" y="34" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">交接的是可验收契约，不是“已审核”四个字</text>
<text x="28" y="58" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">协调者保留控制令牌；子 Agent 只对自己交付的范围负责。</text>
<!-- nodes -->
<rect x="28" y="88" width="200" height="130" rx="16" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/>
<text x="128" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A">协调者</text>
<text x="128" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#334155">目标 / 禁止动作</text>
<text x="128" y="170" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#334155">对象 + 版本</text>
<text x="128" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#334155">证据与预算</text>
<rect x="278" y="88" width="200" height="130" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="378" y="120" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">政策 Agent</text>
<text x="378" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">claim + source/version</text>
<text x="378" y="170" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">适用条件 + limitations</text>
<text x="378" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">completed ≠ 父任务通过</text>
<rect x="278" y="240" width="200" height="100" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="378" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">源码 Agent</text>
<text x="378" y="300" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">同样返回可定位证据</text>
<text x="378" y="322" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#475569">不扩大权限或范围</text>
<rect x="528" y="130" width="180" height="110" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/>
<text x="618" y="166" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#7A4100">对齐 / 汇总</text>
<text x="618" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#7A4100">版本、对象、冲突</text>
<text x="618" y="214" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#7A4100">只纳入 completed</text>
<rect x="758" y="100" width="200" height="70" rx="14" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/>
<text x="858" y="130" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532D">可验收结果</text>
<text x="858" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#14532D">来源一致且证据齐</text>
<rect x="758" y="220" width="200" height="70" rx="14" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/>
<text x="858" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">need_input / conflict</text>
<text x="858" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#7F1D1D">缺席向上传播，不能伪完成</text>
<!-- arrows -->
<line x1="228" y1="130" x2="270" y2="130" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="228" y1="175" x2="270" y2="175" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="478" y1="153" x2="520" y2="153" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M478 290 C510 290 510 200 520 185" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="708" y1="160" x2="750" y2="135" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M708 210 C740 240 748 250 750 255" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="28" y="372" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#64748B">颜色：蓝=控制者；灰=受限交付；黄=核对；绿=可验收；红=缺证/冲突。示意，不代表远端 A2A 已实测。</text>
<text x="28" y="392" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" fill="#64748B">设计稿 v02｜窄屏见 *-narrow-v02</text>
</svg>
