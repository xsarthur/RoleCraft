var(--muted);padding:18px 0;font-size:13px}.q-time{color:var(--muted);font-size:11px;white-space:nowrap}.q-row .text-button{font-size:12px}.config-summary{color:var(--muted);font-size:12px;margin:12px 0 18px}.scope-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.scope-tags span{background:var(--gold-soft);color:var(--gold);padding:3px 7px;border-radius:4px;font-size:11px}@media(max-width:600px){.field-grid{grid-template-columns:1fr;gap:20px}.direction-grid{grid-template-columns:1fr}.config-footer{display:block}.config-footer .button{width:100%;margin-top:10px}.plan-strip{align-items:flex-start;padding:15px}.plan-strip .text-button{white-space:nowrap}.plan-strip p{line-height:1.9}}

<script>
(function(){
'use strict';
const root=document.getElementById('interview-app');
const content=document.getElementById('content');
const questions=[
{id:'q1',title:'Agent 与普通模型调用有什么区别？',type:'基础概念',level:'基础',topic:'Agent 基础',chapter:'认识 Agent 工程',time:5,answer:['普通模型调用通常是一次输入和一次输出。Agent 围绕目标维护状态，根据新观察决定下一步，并在授权范围内调用工具。','回答时说明目标、状态、观察、行动和停止条件，再用一个具体任务串起运行闭环。','固定流程能解决的问题可以先用固定流程；引入动态决策后，也需要验收、权限和成本边界。'],follow:['什么情况下不用 Agent 反而更合适？','如何判断 Agent 的任务已经完成？']},
{id:'q2',title:'工具调用超时，如何避免恢复时重复执行？',type:'工程设计',level:'中等',topic:'工具与恢复',chapter:'可靠的工具调用',time:8,answer:['超时只说明客户端没有取得结果，外部操作可能已经成功。先记录未决状态，再通过操作标识查询外部效果。','为同一逻辑动作保留稳定的幂等键、参数和授权记录；确认下游去重与查询合同后，才判断是否允许重试。','无法确认效果时保持待核对，避免换新键重复创建。用“操作成功但回执丢失”的故障测试验证对象数。'],follow:['如果下游不支持幂等键怎么办？','用户取消任务后还需要查外部结果吗？']},
{id:'q3',title:'如何组织 Agent 的上下文和长期记忆？',type:'基础概念',level:'中等',topic:'上下文与记忆',chapter:'上下文、记忆与提示',time:5,answer:['区分当轮上下文、任务状态和长期记忆，按任务需要选择信息，避免把所有历史塞入提示。','长期记忆保存来源、时间、适用范围和权限，同时支持纠正、删除和失效。','摘要是对事实的压缩表示，仍要能追溯原始证据；旧授权不能自动变成当前授权。'],follow:['如何处理记忆中的过期信息？','为什么摘要也可能引入错误？']},
{id:'q4',title:'如何说明你为什么选择 RAG，而不是微调？',type:'工程设计',level:'中等',topic:'检索与证据',chapter:'检索证据',time:6,answer:['先说明任务、资料更新频率、可追溯要求和质量目标，再比较方案。','RAG 将外部资料作为当前证据，便于更新和引用；微调更多改变模型行为或领域适配，两者也可以结合。','用固定测试集比较检索质量、答案质量、成本和延迟，而不是仅凭一次演示选择方案。'],follow:['检索到了文档是否意味着可以直接用于回答？','如何发现资料更新后检索索引没有同步？']},
{id:'q5',title:'介绍一个你做过的 Agent 项目，如何证明它有效？',type:'项目表达',level:'中等',topic:'项目表达',chapter:'独立作品与复验',time:8,answer:['从真实问题、用户任务和验收条件开始，说明自己的责任范围及为什么这样选型。','描述实现中的一次关键失败、你如何定位原因以及做了什么改进。','用可复现的任务、版本对比和失败记录说明结果；将本人参与的事实与团队贡献分别说清楚。'],follow:['如果面试官要求复现一个失败案例，你会展示什么？','这个方案目前还存在什么限制？']},
{id:'q6',title:'模型返回的 JSON 合法，为什么还不能直接执行？',type:'场景追问',level:'基础',topic:'工具与权限',chapter:'模型候选与业务校验',time:5,answer:['JSON 合法只说明语法可解析，不保证字段类型、业务条件、权限和数据来源正确。','先验证结构，再校验业务值、引用对象、当前授权和操作边界。','模型结果应作为候选输入，外部效果由可信执行层控制。'],follow:['如何处理额外字段？','如何设计可以稳定判错的输出合同？']},
{id:'q7',title:'如何评估一个 Agent 的改进是否真的有效？',type:'工程设计',level:'进阶',topic:'评估与验证',chapter:'同条件版本比较',time:7,answer:['冻结任务、数据、预算和评价标准，在相同条件下比较前后版本。','记录成功、失败、成本、延迟和外部效果，避免只统计挑选出的成功案例。','对随机性做重复实验，并验证新版本没有使已有边界退化。'],follow:['如何排除模型随机性造成的差异？','你如何定义任务成功率？']},
{id:'q8',title:'检索资料里出现要求执行工具的指令，你怎么处理？',type:'场景追问',level:'中等',topic:'工具与权限',chapter:'信任边界',time:5,answer:['把检索内容作为资料，不让资料文本改变用户授权或工具权限。','工具执行要核对当前主体、目标范围、参数和操作许可，不能由模型或检索文档自行批准。','用恶意文档测试是否能越过读取、返回和执行边界。'],follow:['读取权限和执行权限有什么不同？','如何验证恶意指令没有绕过工具限制？']},
{id:'q9',title:'服务中断后，Agent 如何恢复到可靠的执行位置？',type:'工程设计',level:'进阶',topic:'工具与恢复',chapter:'持久状态与恢复',time:8,answer:['以持久化状态和已提交事件为恢复依据，重新加载目标版本、任务进度和外部效果账本。','先核对在途或未决动作，避免把进程退出当作外部操作失败。','恢复时仍验证当前权限、截止时间和预算，然后从已确认的位置继续。'],follow:['哪些状态不能只放在内存中？','如何验证跨重启不重复产生外部效果？']},
{id:'q10',title:'项目成本增加时，你会如何定位并优化？',type:'项目表达',level:'中等',topic:'成本与交付',chapter:'运行成本与任务账目',time:6,answer:['先定义一次完整任务的成本口径，覆盖调用、检索、失败和重试。','找出调用次数、上下文长度和重复工作等成本来源，比较简化流程与不同模型的取舍。','在固定任务集上检查质量、成本和延迟，优化结果需要同时满足验收条件。'],follow:['减少调用数会影响什么？','如何避免缓存复用到过期或越权内容？']}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const directions=[
{ id:'foundation',title:'Agent 基础',desc:'运行闭环、上下文与记忆',ids:['q1','q3'] },
{ id:'retrieval',title:'RAG 与检索',desc:'知识库、引用与资料更新',ids:['q4'] },
{ id:'tools',title:'工具调用与可靠性',desc:'幂等、失败处理与恢复',ids:['q2','q9'] },
{ id:'security',title:'安全与权限',desc:'输出校验与信任边界',ids:['q6','q8'] },
{ id:'evaluation',title:'评估与成本',desc:'效果比较、成本与交付',ids:['q7','q10'] },
{ id:'project',title:'项目表达',desc:'项目介绍、结果与追问',ids:['q5'] }
];
const chapters=[
{id:'start',number:'01',title:'起点与问题',desc:'认识 Agent、问题边界和学习起点',bodyTitle:'先定义问题，再决定是否需要 Agent',body:['先从用户任务、输入输出和完成条件说清楚问题，再判断是否需要动态决策。能用固定流程解决的任务，应优先保持简单。']},
{id:'tools',number:'02',title:'可靠的工具调用',desc:'幂等、失败处理、恢复和外部效果',bodyTitle:'工具超时不等于执行失败',body:['工具可能已经产生外部效果，但程序没有收到回执。恢复时先核对事实，再决定下一步，避免重复创建工单或重复提交操作。','同一逻辑动作使用稳定的操作标识，并记录参数、权限、尝试和结果。无法确认效果时，保留待核对状态。']},
{id:'retrieval',number:'03',title:'检索与证据',desc:'资料版本、引用和检索结果验证',bodyTitle:'检索结果需要证据和版本',body:['回答前确认资料来源、版本和适用范围。检索到内容不等于内容正确，关键结论需要能回到可核验的证据。']},
{id:'delivery',number:'04',title:'运行交付',desc:'任务账目、成本和可恢复交付',bodyTitle:'把运行结果交付到可恢复的位置',body:['记录任务状态、成本、权限和外部效果，异常时从已确认的位置继续。验收应覆盖成功、失败、重试和恢复路径。']}
];
const chapterQuestionIds={start:['q1'],tools:['q2','q6','q9'],retrieval:['q4'],delivery:['q5','q7','q10']};
const chapterById=id=>chapters.find(ch=>ch.id===id)||chapters[1];
const chapterQuestions=id=>(chapterQuestionIds[id]||[]).map(qid=>questions.find(q=>q.id===qid)).filter(Boolean);
const st={screen:'home',chapterId:'tools',duration:14,minutes:30,selectedDirections:directions.map(d=>d.id),day:3,viewDay:3,generation:0,ratings:{},userStates:{q2:'review',q6:'unsure',q8:'review'},answers:{},extra:[],questionIndex:0,origin:'plan',showAnswer:false,filter:'all',timer:false,elapsed:0};
let draft=null;
const selectedPool=(selection=st.selectedDirections)=>questions.filter(q=>directions.some(d=>selection.includes(d.id)&&d.ids.includes(q.id)));
function schedule(options={duration:st.duration,minutes:st.minutes,directions:st.selectedDirections}){
 const pool=selectedPool(options.directions);const result=[];let cursor=0;
 for(let day=1;day<=options.duration;day++){
  const items=[];let used=0;const visited=new Set();
  for(let n=0;n<pool.length&&items.length<10;n++){
   const q=pool[(cursor+n)%pool.length];if(visited.has(q.id)||used+q.time>options.minutes)continue;
   visited.add(q.id);items.push({q,key:'p'+st.generation+'-d'+day+'-'+q.id});used+=q.time;
  }
  cursor=(cursor+Math.max(1,items.length))%Math.max(1,pool.length);
  result.push({day,items,time:used});
 }
 return result;
}
const days=()=>schedule();
const todayItems=()=>days()[st.day-1].items.concat(st.extra.map(id=>({q:questions.find(q=>q.id===id),key:'p'+st.generation+'-extra-'+id})));
const allPlanItems=()=>days().flatMap(day=>day.items).concat(st.extra.map(id=>({q:questions.find(q=>q.id===id),key:'p'+st.generation+'-extra-'+id})));
const totals=()=>allPlanItems().length;
const done=()=>allPlanItems().filter(item=>st.ratings[item.key]).length;
const progress=()=>totals()?Math.round(done()/totals()*100):0;
const scopeText=()=>directions.filter(d=>st.selectedDirections.includes(d.id)).map(d=>d.title).join(' · ');
const itemTime=items=>items.reduce((sum,item)=>sum+item.q.time,0);
const status=s=>s==='known'?'已掌握':s==='review'?'需要复习':s==='unsure'?'暂不会':'未开始';
const statusClass=s=>s==='known'?'known':s==='review'?'review':s==='unsure'?'unsure':'';
const dueQuestions=()=>selectedPool().filter(q=>['review','unsure'].includes(st.userStates[q.id]));
function row(q,key,index){const rating=key.startsWith('review-')?st.userStates[q.id]:st.ratings[key];return '<div class="q-row"><span class="q-num">'+String(index+1).padStart(2,'0')+'</span><div class="q-main"><button data-action="question" data-id="'+q.id+'" data-key="'+key+'">'+esc(q.title)+'</button><small>'+q.type+' · '+q.chapter+' · '+q.time+' 分钟</small></div><span class="q-status '+statusClass(rating)+'">'+status(rating)+'</span></div>';}
function configuration(){return '<div class="plan-strip"><div><strong>'+st.duration+' 天 · 每天 '+st.minutes+' 分钟</strong><p>'+esc(scopeText())+'</p></div><button class="text-button" data-action="configure">调整计划 →</button></div>';}
function config(){if(!draft)draft={duration:st.duration,minutes:st.minutes,directions:[...st.selectedDirections]};return '<div class="config-wrap"><button class="back" data-action="screen" data-screen="home">← 面试准备</button><div class="page-head"><div><div class="eyebrow">Agent 开发者</div><h1>自定义面试计划</h1><p>按你的时间和目标，安排每天的练习。</p></div></div><form class="panel" id="plan-form"><div class="field-grid"><div><label class="field-label" for="plan-days">准备天数</label><div class="number-field"><input id="plan-days" name="days" type="number" min="1" max="180" step="1" required value="'+draft.duration+'"><span>天</span></div><div class="presets">'+[7,14,30].map(n=>'<button type="button" data-action="preset-days" data-value="'+n+'" class="'+(n===draft.duration?'selected':'')+'">'+n+' 天</button>').join('')+'</div></div><div><label class="field-label" for="plan-minutes">每天投入时间</label><div class="number-field"><input id="plan-minutes" name="minutes" type="number" min="5" max="180" step="1" required value="'+draft.minutes+'"><span>分钟</span></div><div class="presets">'+[15,30,60].map(n=>'<button type="button" data-action="preset-minutes" data-value="'+n+'" class="'+(n===draft.minutes?'selected':'')+'">'+n+' 分钟</button>').join('')+'</div></div></div><div class="config-section"><div class="section-title"><h2>准备方向</h2><span class="muted small">可多选</span></div><div class="direction-grid">'+directions.map(d=>'<label class="direction"><input type="checkbox" name="direction" value="'+d.id+'" '+(draft.directions.includes(d.id)?'checked':'')+'><span><strong>'+d.title+'</strong><small>'+d.desc+'</small></span></label>').join('')+'</div></div><div class="plan-preview" id="plan-preview" aria-live="polite"></div><p class="form-error" id="config-error" role="alert"></p><div class="config-footer"><span>已练记录保留，未完成练习按新计划安排。</span><button class="button" type="submit">保存并生成计划 →</button></div></form></div>';}
function syncDraft(){const form=document.getElementById('plan-form');if(!form)return;draft={duration:Number(form.elements.days.value),minutes:Number(form.elements.minutes.value),directions:[...form.querySelectorAll('input[name="direction"]:checked')].map(x=>x.value)};}
function updatePreview(){syncDraft();const preview=document.getElementById('plan-preview');if(!preview)return;const valid=Number.isInteger(draft.duration)&&draft.duration>=1&&draft.duration<=180&&Number.isInteger(draft.minutes)&&draft.minutes>=5&&draft.minutes<=180&&draft.directions.length;
 if(!valid){preview.innerHTML='<strong>完善准备时间和方向</strong><p>至少选择一个准备方向。</p>';return;}
 const generated=schedule(draft);const counts=generated.map(d=>d.items.length);const low=Math.min(...counts),high=Math.max(...counts);preview.innerHTML='<strong>'+draft.duration+' 天 · 每天 '+draft.minutes+' 分钟 · '+draft.directions.length+' 个准备方向</strong><p>总投入 '+(draft.duration*draft.minutes)+' 分钟 · '+(high?'每天约 '+(low===high?low:low+'–'+high)+' 道题，按题目预计用时安排，包含重复复习。':'当前时间不足以完成该方向的单题，请增加每天的时间。')+'</p>';
 document.querySelectorAll('[data-action="preset-days"]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.value)===draft.duration));document.querySelectorAll('[data-action="preset-minutes"]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.value)===draft.minutes));
}
function home(){const items=todayItems(),remaining=items.filter(item=>!st.ratings[item.key]).length;const due=dueQuestions();return '<div class="page-head"><div><div class="eyebrow">Agent 开发者</div><h1>面试准备</h1><p>从理解知识，到能在面试中说清楚。</p></div><button class="button secondary" data-action="screen" data-screen="plan">查看计划 →</button></div>'+configuration()+'<div class="overview"><section class="panel"><div class="mission-head"><div><h2>今日练习</h2><p>第 '+st.day+' 天 · 预计 '+itemTime(items)+' 分钟</p></div><button class="button" data-action="start">'+(remaining?'继续练习':'再练一轮')+' →</button></div><div class="progress-note"><span>今日 '+(items.length-remaining)+' / '+items.length+' 道已练</span><span>还剩 '+remaining+' 道</span></div><div class="progress"><i style="width:'+(items.length?((items.length-remaining)/items.length*100):0)+'%"></i></div><div class="q-list">'+items.map((item,i)=>row(item.q,item.key,i)).join('')+'</div><div class="route-sequence">按准备方向安排新题，再重复复习。</div></section><aside class="right-column"><section class="panel"><div class="title-inline"><h2>待复习</h2><button class="text-button" data-action="screen" data-screen="review">查看全部 →</button></div><div class="review-line"><span class="review-count">'+due.length+'</span><p>道题待复习<br>来自你的练习自评</p></div>'+(due.length?'<button class="button secondary" data-action="review-start">开始复习</button>':'<p class="small muted">当前没有待复习题。</p>')+'</section><section class="panel"><h2>需要加强的主题</h2>'+(due.length?[...new Set(due.map(q=>q.topic))].map(topic=>'<div class="topic"><div><span>'+topic+'</span><small>'+due.filter(q=>q.topic===topic).length+' 道题待复习</small></div><button class="text-button" data-action="screen" data-screen="review">练习 →</button></div>').join(''):'<p class="small muted">练习后根据自评更新。</p>')+'</section><section class="panel"><h2>'+st.duration+' 天计划</h2><div class="progress-note"><span>'+done()+' / '+totals()+' 次练习</span><span>'+progress()+'%</span></div><div class="progress"><i style="width:'+progress()+'%"></i></div><p class="time-note">每天 '+st.minutes+' 分钟 · 含新题与复习</p></section></aside></div>';}
function plan(){const d=days()[st.viewDay-1],items=d.items;return '<button class="back" data-action="screen" data-screen="home">← 面试准备</button><div class="page-head"><div><h1>'+st.duration+' 天准备计划</h1><p>Agent 开发者 · 每天 '+st.minutes+' 分钟</p><div class="scope-tags">'+directions.filter(x=>st.selectedDirections.includes(x.id)).map(x=>'<span>'+x.title+'</span>').join('')+'</div></div><button class="button secondary" data-action="configure">调整计划</button></div><section class="panel plan-summary"><div><div class="progress-note"><span>计划进度</span><span>'+progress()+'%</span></div><div class="progress"><i style="width:'+progress()+'%"></i></div></div><span class="plan-count">'+done()+' <span class="muted small">/ '+totals()+' 次</span></span></section><div class="day-list" aria-label="计划日期">'+Array.from({length:st.duration},(_,i)=>{const daily=days()[i];const finished=daily.items.every(x=>st.ratings[x.key]);return '<button class="day-button '+(st.viewDay===i+1?'active':'')+'" data-action="day" data-day="'+(i+1)+'" aria-pressed="'+(st.viewDay===i+1)+'">第 '+(i+1)+' 天<small>'+(finished?'已完成':i+1===st.day?'今天':'待练习')+'</small></button>';}).join('')+'</div><section class="panel"><div class="title-inline"><h2>第 '+st.viewDay+' 天的练习</h2><span class="small muted">'+items.length+' 道题 · 预计 '+d.time+' / '+st.minutes+' 分钟</span></div><div class="q-list">'+items.map((item,i)=>row(item.q,item.key,i)).join('')+'</div></section><p class="time-note">按你的方向与每日时间安排；预计用时仅作准备参考。</p>';}
function review(){const due=dueQuestions().filter(q=>st.filter==='all'||st.userStates[q.id]===st.filter);return '<button class="back" data-action="screen" data-screen="home">← 面试准备</button><div class="page-head"><div><h1>待复习</h1><p>先再试一次，再核对参考回答。</p></div>'+(due.length?'<button class="button" data-action="review-start">开始复习 →</button>':'')+'</div><div class="filter-row">'+[['all','全部'],['review','需要复习'],['unsure','暂不会']].map(([v,label])=>'<button data-action="filter" data-filter="'+v+'" class="'+(st.filter===v?'selected':'')+'" aria-pressed="'+(st.filter===v)+'">'+label+'</button>').join('')+'</div><section class="panel"><div class="q-list">'+(due.length?due.map((q,i)=>row(q,'review-'+q.id,i)).join(''):'<p class="empty-state">当前范围没有待复习题。</p>')+'</div></section>';}
function practice(){const q=questions[st.questionIndex],chapter=chapterById(st.chapterId),back=st.origin==='chapter'?'<button class="back" data-action="chapter" data-chapter-id="'+chapter.id+'">← 返回'+chapter.title+'</button>':'<button class="back" data-action="screen" data-screen="'+st.origin+'">← '+(st.origin==='review'?'返回待复习':st.origin==='home'?'返回面试准备':'返回计划')+'</button>';return back+'<div class="practice-layout"><article class="panel"><div class="eyebrow">'+q.type+' · '+q.level+'</div><h1 class="practice-title">'+q.title+'</h1><div class="tags"><span class="tag">'+q.topic+'</span><span class="tag">'+q.chapter+'</span></div><div class="answer-label"><label for="my-answer">我的回答</label><div class="timer"><span id="elapsed">'+formatTime(st.elapsed)+'</span><button data-action="timer">'+(st.timer?'暂停计时':'开始计时')+'</button></div></div><textarea class="answer-input" id="my-answer" placeholder="先试着用自己的话回答，也可以口述后直接核对。">'+esc(st.answers[q.id]||'')+'</textarea><div class="practice-actions"><button class="button" data-action="answer">'+(st.showAnswer?'收起参考':'查看参考回答')+'</button><button class="button quiet" data-action="save">暂存回答</button><span class="muted small">预计 '+q.time+' 分钟</span></div><div '+(st.showAnswer?'':'hidden')+'><details class="reference" open><summary>参考回答</summary><ol>'+q.answer.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol></details><details class="reference"><summary>面试官可能继续追问</summary><ul>'+q.follow.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></details></div><div class="notification" id="status" role="status" aria-live="polite"></div></article><aside class="right-column"><section class="panel"><h2>自评与复习</h2><p class="muted small">核对后，选择这次练习的掌握程度。</p><div class="rating-buttons">'+[['known','✓ 已掌握','以后安排巩固复习'],['review','↻ 需要复习','明天再练一次'],['unsure','? 暂不会','先回教材补学，再练习']].map(([v,label,note])=>'<button data-action="rate" data-rating="'+v+'" class="'+(st.ratings[st.practiceKey]===v?'selected':'')+'" aria-pressed="'+(st.ratings[st.practiceKey]===v)+'">'+label+'<small>'+note+'</small></button>').join('')+'</div><button class="button secondary" style="width:100%" data-action="next">下一题 →</button></section><section class="panel"><h2>回到教材</h2><button class="text-button related-link" style="text-align:left;width:100%" data-action="chapter" data-chapter-id="'+chapter.id+'">'+chapter.title+' →</button><span class="small muted">补齐概念，再回来回答。</span></section></aside></div>';}
function related(q){return '<div class="related-item"><button data-action="question" data-id="'+q.id+'" data-key="chapter-'+q.id+'">'+esc(q.title)+'</button><button class="button secondary" data-action="add" data-id="'+q.id+'">'+(st.extra.includes(q.id)?'已加入':'加入计划')+'</button></div>';}
function courseHome(){const directory=chapters.map(ch=>'<div class="q-row"><span class="q-num">'+ch.number+'</span><div class="q-main"><button data-action="chapter" data-chapter-id="'+ch.id+'">'+ch.title+'</button><small>'+ch.desc+'</small></div><span class="q-status '+(ch.id==='start'?'known':ch.id==='tools'?'unsure':'')+'">'+(ch.id==='start'?'已学习':ch.id==='tools'?'继续阅读':'未开始')+'</span></div>').join('');return '<div class="page-head"><div><div class="eyebrow">Agent 开发者</div><h1>课程学习</h1><p>按课程路线理解 Agent 工程，再进入对应章节阅读。</p></div><button class="button secondary" data-action="screen" data-screen="home">面试准备 →</button></div><section class="panel"><div class="mission-head"><div><h2>继续学习</h2><p>从工具调用的可靠性开始，逐步完成基础、工程和交付。</p></div><button class="button" data-action="chapter" data-chapter-id="tools">开始阅读 →</button></div><div class="progress-note"><span>课程进度</span><span>2 / 30 篇</span></div><div class="progress"><i style="width:7%"></i></div></section><div class="section-title"><h2>课程目录</h2><span class="muted small">30 篇 · Agent 工程</span></div><section class="panel q-list">'+directory+'</section>';}
function chapter(){const ch=chapterById(st.chapterId),items=chapterQuestions(ch.id),knowledge=ch.id==='tools'?'<details class="knowledge-example" open><summary>知识点：幂等与恢复</summary><p>把“重复请求”与“重复效果”分开。恢复依赖稳定身份和可查询的事实，而不是仅靠重试次数。</p></details>':'';return '<button class="back" data-action="screen" data-screen="course-home">← 课程学习</button><article class="chapter"><div class="eyebrow">课程学习 · 第 '+ch.number+' 章</div><h1>'+ch.title+'</h1><p class="muted">'+ch.desc+'</p><div class="chapter-content"><h2>'+ch.bodyTitle+'</h2>'+ch.body.map(p=>'<p>'+p+'</p>').join('')+knowledge+'<section class="related-module"><div class="title-inline"><h2>本章相关面试题</h2><button class="text-button" data-action="screen" data-screen="home">面试准备 →</button></div>'+(items.length?items.map(related).join(''):'<p class="empty-state">本章暂未配置面试题。</p>')+'</section><div class="notification" id="status" role="status" aria-live="polite"></div></div></article>';}
function formatTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function capture(){const input=document.getElementById('my-answer');if(input)st.answers[questions[st.questionIndex].id]=input.value;}
function render(){const ch=chapterById(st.chapterId);content.innerHTML=({home,plan,review,practice,chapter,config,'course-home':courseHome}[st.screen]||home)();const crumbs={home:'面试准备',plan:'面试准备 / 准备计划',review:'面试准备 / 待复习',practice:st.origin==='chapter'?'课程学习 / '+ch.title+' / 题目练习':'面试准备 / 题目练习',chapter:'课程学习 / '+ch.title,'course-home':'课程学习',config:'面试准备 / 自定义计划'};document.getElementById('breadcrumb').textContent=crumbs[st.screen];const courseActive=['course-home','chapter'].includes(st.screen)||st.screen==='practice'&&st.origin==='chapter';document.getElementById('profile-context').textContent=courseActive?'课程学习':'面试准备';document.getElementById('footer-context').textContent=courseActive?'课程学习':'面试准备';root.querySelectorAll('[data-action="screen"][data-screen]').forEach(b=>{if(b.closest('.nav')||b.closest('.mobile-nav'))b.classList.toggle('active',b.dataset.screen==='course-home'?courseActive:!courseActive);});if(st.screen==='config')updatePreview();}
function show(screen){capture();st.screen=screen;st.timer=false;render();window.scrollTo(0,0);}
function openQuestion(id,key,origin,chapterId){capture();st.questionIndex=questions.findIndex(q=>q.id===id);st.practiceKey=key;st.origin=origin||'plan';if(chapterId)st.chapterId=chapterId;st.showAnswer=false;st.elapsed=0;st.timer=false;st.screen='practice';render();window.scrollTo(0,0);}
root.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;capture();
 if(action==='screen')show(b.dataset.screen);
 else if(action==='chapter'){st.chapterId=b.dataset.chapterId||st.chapterId;show('chapter');}
 else if(action==='configure'){draft={duration:st.duration,minutes:st.minutes,directions:[...st.selectedDirections]};show('config');}
 else if(action==='preset-days'||action==='preset-minutes'){const input=document.getElementById(action==='preset-days'?'plan-days':'plan-minutes');input.value=b.dataset.value;updatePreview();}
 else if(action==='day'){st.viewDay=Number(b.dataset.day);render();}
 else if(action==='question')openQuestion(b.dataset.id,b.dataset.key,st.screen,st.screen==='chapter'?st.chapterId:null);
 else if(action==='start'){const item=todayItems().find(x=>!st.ratings[x.key])||todayItems()[0];if(item)openQuestion(item.q.id,item.key,'plan');}
 else if(action==='review-start'){const q=dueQuestions().find(q=>st.filter==='all'||st.userStates[q.id]===st.filter)||dueQuestions()[0];if(q)openQuestion(q.id,'review-'+q.id,'review');}
 else if(action==='filter'){st.filter=b.dataset.filter;render();}
 else if(action==='answer'){st.showAnswer=!st.showAnswer;render();}
 else if(action==='timer'){st.timer=!st.timer;b.textContent=st.timer?'暂停计时':'开始计时';}
 else if(action==='save')document.getElementById('status').textContent='本次原型中的回答已暂存。';
 else if(action==='rate'){st.ratings[st.practiceKey]=b.dataset.rating;st.userStates[questions[st.questionIndex].id]=b.dataset.rating;render();document.getElementById('status').textContent='已标记为“'+status(b.dataset.rating)+'”。'+(b.dataset.rating==='known'?'已完成本次练习。':'已加入复习安排。');}
 else if(action==='next'){let list=st.origin==='review'?dueQuestions().map(q=>({q,key:'review-'+q.id})):st.origin==='chapter'?chapterQuestions(st.chapterId).map(q=>({q,key:'chapter-'+q.id})):todayItems();const i=list.findIndex(x=>x.key===st.practiceKey);const next=list[i+1]||list.find(x=>!st.ratings[x.key]);if(next)openQuestion(next.q.id,next.key,st.origin,st.origin==='chapter'?st.chapterId:null);else show(st.origin);}
 else if(action==='add'){if(!st.extra.includes(b.dataset.id))st.extra.push(b.dataset.id);render();document.getElementById('status').textContent='已加入今日额外练习，原计划时间保持不变。';}
});
root.addEventListener('input',e=>{if(e.target.id==='my-answer')st.answers[questions[st.questionIndex].id]=e.target.value;if(e.target.closest('#plan-form'))updatePreview();});
root.addEventListener('change',e=>{if(e.target.closest('#plan-form'))updatePreview();});
root.addEventListener('submit',e=>{if(e.target.id!=='plan-form')return;e.preventDefault();syncDraft();const error=document.getElementById('config-error');
 if(!Number.isInteger(draft.duration)||draft.duration<1||draft.duration>180||!Number.isInteger(draft.minutes)||draft.minutes<5||draft.minutes>180){error.textContent='请输入 1–180 天、5–180 分钟的整数。';return;}
 if(!draft.directions.length){error.textContent='至少选择一个准备方向。';return;}
 const generated=schedule(draft);if(generated.some(d=>!d.items.length)){error.textContent='当前时间不足以完成该方向的单题，请增加每天的时间。';return;}
 st.duration=draft.duration;st.minutes=draft.minutes;st.selectedDirections=[...draft.directions];st.day=1;st.viewDay=1;st.generation++;st.extra=[];st.showAnswer=false;draft=null;show('plan');
});
// Seed the prototype with a partly completed current plan.
for(const d of days().slice(0,2))for(const item of d.items)st.ratings[item.key]='known';
for(const item of [todayItems()[0],todayItems()[2]].filter(Boolean))st.ratings[item.key]='known';
setInterval(()=>{if(st.timer&&st.screen==='practice'){st.elapsed++;const node=document.getElementById('elapsed');if(node)node.textContent=formatTime(st.elapsed);}},1000);
render();
})();
</script>
</body>
</html>
