<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">职造 1.0 学习工作台视觉交接</title>
  <desc id="desc">设计示意而非运行截图。左侧是五个主入口，中间是首页唯一当前任务卡与路线状态，右侧是查教材入口、检索中和有依据结果状态。底部是不同视口的布局关系和非颜色状态图例。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#755624" stroke-width="1.7"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#3d3929}
      .title{font-size:27px;font-weight:650}.h{font-size:18px;font-weight:650}.label{font-size:15px}.small{font-size:13px;fill:#6b6356}.tiny{font-size:12px;fill:#6b6356}.panel{fill:#fff;stroke:#dcd7cc;stroke-width:1.5}.line{stroke:#e8e4dc;stroke-width:1.2}.gold{fill:#f5f0e4;stroke:#755624;stroke-width:1.8}.green{fill:#e1f5ee;stroke:#0f6e56;stroke-width:1.5}.orange{fill:#faece7;stroke:#a84927;stroke-width:1.5}.muted{fill:#f3f0ea;stroke:#dcd7cc;stroke-width:1.3}.primary{fill:#755624}.white{fill:#fff}.connection{fill:none;stroke:#755624;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1050" fill="#f9f7f3"/>
  <text x="40" y="48" class="title">职造 1.0 · 一条主路径，辅助入口不抢任务</text>
  <rect x="1122" y="22" width="336" height="34" rx="7" fill="#f5f0e4" stroke="#d5c39d"/>
  <text x="1290" y="45" text-anchor="middle" class="tiny">设计示意 · 非运行截图 / 非真实记录</text>
  <text x="40" y="78" class="small">位置、动作、状态先由空间和形状表达；文字补充真实来源与恢复动作。</text>

  <!-- Primary shell -->
  <rect x="40" y="112" width="216" height="650" rx="14" class="panel"/>
  <text x="63" y="150" class="h">职造</text>
  <text x="63" y="173" class="tiny">Agent 开发学习</text>
  <line x1="63" y1="191" x2="232" y2="191" class="line"/>
  <text x="63" y="223" class="small">主导航</text>
  <rect x="58" y="241" width="180" height="48" rx="8" class="gold"/>
  <text x="80" y="271" class="label" font-weight="650">⌂  首页 / 学习</text>
  <rect x="58" y="296" width="180" height="48" rx="8" class="muted"/>
  <text x="80" y="326" class="label">▤  课程</text>
  <rect x="58" y="351" width="180" height="48" rx="8" class="muted"/>
  <text x="80" y="381" class="label">□  题库</text>
  <rect x="58" y="406" width="180" height="48" rx="8" class="muted"/>
  <text x="80" y="436" class="label">↻  记录</text>
  <rect x="58" y="461" width="180" height="48" rx="8" class="muted"/>
  <text x="80" y="491" class="label">⚙  设置</text>
  <line x1="63" y1="534" x2="232" y2="534" class="line"/>
  <text x="63" y="563" class="tiny">当前学习方向</text>
  <text x="63" y="588" class="label" font-weight="650">Agent 开发者</text>
  <rect x="58" y="616" width="180" height="76" rx="8" fill="#f3f0ea"/>
  <text x="72" y="643" class="tiny">本机学习者</text>
  <text x="72" y="667" class="tiny">记录保存在此浏览器</text>
  <text x="63" y="728" class="tiny">低频工具 → 设置内折叠</text>

  <!-- Main home -->
  <rect x="282" y="112" width="720" height="650" rx="14" class="panel"/>
  <text x="312" y="151" class="small">首页 / 当前学习方向：Agent 开发者</text>
  <text x="312" y="190" font-size="26" font-weight="650">继续你的学习任务</text>
  <text x="312" y="216" class="small">当前任务只有一个主入口；路线图和目录用于探索。</text>
  <rect x="312" y="242" width="660" height="142" rx="12" class="gold"/>
  <text x="336" y="273" class="tiny" fill="#755624">正在阅读</text>
  <text x="336" y="308" font-size="20" font-weight="650">认识 Agent 工程</text>
  <text x="336" y="335" class="small">最近位置：运行边界 · 可继续阅读；阅读记录不等于掌握。</text>
  <rect x="789" y="286" width="155" height="52" rx="8" class="primary"/>
  <text x="867" y="319" text-anchor="middle" font-size="15" fill="#fff">继续阅读 →</text>
  <text x="312" y="425" class="h">学习路线</text>
  <text x="312" y="449" class="tiny">阶段状态：未开始 · 阅读中 · 已提交证据 · 待独立验证</text>
  <rect x="312" y="467" width="660" height="83" rx="10" class="panel"/>
  <circle cx="347" cy="509" r="17" fill="#f5f0e4" stroke="#755624" stroke-width="2"/>
  <text x="347" y="514" text-anchor="middle" class="tiny" fill="#755624">1</text>
  <text x="378" y="500" class="label" font-weight="650">认识与准备</text>
  <text x="378" y="524" class="tiny">阅读中 · 01–06 · 当前阶段</text>
  <rect x="754" y="491" width="187" height="36" rx="6" fill="#f5f0e4" stroke="#d5c39d"/>
  <text x="847" y="514" text-anchor="middle" class="tiny">可展开查看真实单元</text>
  <rect x="312" y="561" width="660" height="83" rx="10" class="panel"/>
  <circle cx="347" cy="603" r="17" fill="#f3f0ea" stroke="#dcd7cc" stroke-width="2"/>
  <text x="347" y="608" text-anchor="middle" class="tiny">2</text>
  <text x="378" y="594" class="label" font-weight="650">程序与模型边界</text>
  <text x="378" y="618" class="tiny">未开始 · 07–09 · 可选分支按课程关系显示</text>
  <line x1="312" y1="678" x2="972" y2="678" class="line"/>
  <text x="312" y="710" class="small">路线图 / 课程目录</text>
  <rect x="783" y="687" width="189" height="38" rx="7" class="muted"/>
  <text x="877" y="712" text-anchor="middle" class="tiny">切换视图 →</text>

  <!-- Arrow between navigation and main task -->
  <path d="M256 265 H278" class="connection"/>
  <text x="267" y="246" text-anchor="middle" class="tiny">开始</text>

  <!-- Retrieval states -->
  <text x="1045" y="121" class="h">可选：查教材</text>
  <text x="1045" y="145" class="small">锚定右下角；不替代学习任务</text>
  <rect x="1045" y="166" width="410" height="78" rx="12" class="panel"/>
  <circle cx="1077" cy="205" r="14" fill="#f5f0e4" stroke="#755624" stroke-width="1.5"/>
  <text x="1077" y="210" text-anchor="middle" font-size="18">⌕</text>
  <text x="1104" y="200" class="label" font-weight="650">查教材</text>
  <text x="1104" y="222" class="tiny">描述概念或问题，推荐原文位置</text>
  <rect x="1361" y="184" width="70" height="40" rx="7" class="primary"/>
  <text x="1396" y="209" text-anchor="middle" font-size="13" fill="#fff">打开</text>

  <text x="1045" y="282" class="small">状态样例：等待与有依据结果互斥</text>
  <rect x="1045" y="301" width="410" height="108" rx="12" class="muted"/>
  <circle cx="1077" cy="339" r="14" fill="#f5f0e4" stroke="#755624" stroke-width="1.5"/>
  <text x="1077" y="345" text-anchor="middle" font-size="18">…</text>
  <text x="1104" y="336" class="label" font-weight="650">正在查找教材依据</text>
  <text x="1104" y="360" class="tiny">保留当前阅读；可以收起继续学习</text>
  <rect x="1104" y="374" width="100" height="25" rx="4" fill="#fff" stroke="#dcd7cc"/>
  <text x="1154" y="391" text-anchor="middle" class="tiny">收起</text>

  <rect x="1045" y="431" width="410" height="225" rx="12" class="panel"/>
  <rect x="1064" y="450" width="108" height="27" rx="5" class="green"/>
  <text x="1118" y="469" text-anchor="middle" class="tiny" fill="#0f6e56">有依据 · 当前 v12</text>
  <text x="1064" y="505" class="label" font-weight="650">推荐去哪里：运行边界</text>
  <text x="1064" y="529" class="tiny">为什么匹配：问题涉及 Agent 的控制边界</text>
  <rect x="1064" y="545" width="372" height="48" rx="7" fill="#f5f0e4" stroke="#dcd7cc"/>
  <text x="1080" y="574" class="tiny">原文依据 · 第 07 篇 / 运行边界 · 展开查看</text>
  <rect x="1064" y="606" width="164" height="36" rx="6" class="primary"/>
  <text x="1146" y="629" text-anchor="middle" font-size="13" fill="#fff">阅读这一节 →</text>
  <text x="1248" y="629" class="tiny">来源版本和位置可追溯</text>

  <!-- Evidence row -->
  <rect x="282" y="790" width="1173" height="127" rx="14" class="panel"/>
  <text x="312" y="827" class="h">记录与证据：同一页面看出对象不同</text>
  <rect x="312" y="849" width="206" height="45" rx="7" class="muted"/>
  <text x="415" y="876" text-anchor="middle" class="tiny">本人自述 · 已填写</text>
  <rect x="536" y="849" width="206" height="45" rx="7" class="green"/>
  <text x="639" y="876" text-anchor="middle" class="tiny" fill="#0f6e56">运行证据 · 已提供</text>
  <rect x="760" y="849" width="206" height="45" rx="7" class="orange"/>
  <text x="863" y="876" text-anchor="middle" class="tiny" fill="#a84927">独立评价 · 未开始</text>
  <rect x="984" y="849" width="206" height="45" rx="7" class="muted"/>
  <text x="1087" y="876" text-anchor="middle" class="tiny">真人评审 · 未验证</text>
  <text x="1214" y="875" class="tiny">状态不靠颜色单独表达</text>

  <!-- Responsive / legend -->
  <rect x="40" y="944" width="1415" height="72" rx="12" fill="#f3f0ea" stroke="#dcd7cc"/>
  <text x="63" y="973" class="label" font-weight="650">响应式验收</text>
  <text x="177" y="973" class="tiny">≥1280：正文 680–740px + 先修右栏</text>
  <text x="483" y="973" class="tiny">761–1279：单列，先修在正文前</text>
  <text x="752" y="973" class="tiny">≤760：菜单 + 全屏工作表</text>
  <text x="1000" y="973" class="tiny">320/375/390/768/1280 + 200% 缩放</text>
  <text x="63" y="997" class="tiny">键盘、读屏、灰度和软键盘均须保持主动作、焦点、状态和恢复路径；本图未代表真实浏览器通过。</text>
</svg>
