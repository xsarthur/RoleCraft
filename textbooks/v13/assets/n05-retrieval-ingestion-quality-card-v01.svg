<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">检索候选质量卡</title><desc id="desc">候选内容依次检查版本、意图匹配、原文定位和证据状态；任一检查失败就降级或返回无匹配。</desc><rect width="1200" height="360" rx="20" fill="#F8FAFC"/><text x="42" y="48" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#0F172A">候选返回前的四个检查</text><g font-family="system-ui,sans-serif" font-size="16"><rect x="42" y="92" width="250" height="160" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="66" y="130" fill="#075985" font-weight="700">版本一致</text><text x="66" y="164" fill="#0F172A">命中当前教材版本</text><text x="66" y="198" fill="#0F172A">否则降级为旧版提示</text><rect x="322" y="92" width="250" height="160" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="346" y="130" fill="#5B21B6" font-weight="700">意图匹配</text><text x="346" y="164" fill="#0F172A">回答用户表达的目标</text><text x="346" y="198" fill="#0F172A">歧义时请求澄清</text><rect x="602" y="92" width="250" height="160" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="626" y="130" fill="#166534" font-weight="700">原文定位</text><text x="626" y="164" fill="#0F172A">章节 / 小节 / 锚点可追溯</text><text x="626" y="198" fill="#0F172A">不能只给无出处摘要</text><rect x="882" y="92" width="276" height="160" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="906" y="130" fill="#92400E" font-weight="700">证据状态</text><text x="906" y="164" fill="#0F172A">已验证 / 示意 / 未知</text><text x="906" y="198" fill="#0F172A">无匹配就明确说明</text></g><text x="42" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#475569">示意构造；候选推荐不等于教材答案，也不替代人工或真实用户验证。</text></svg>
