<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><title>外部 API 四道边界</title><desc>输入校验、授权、响应和业务一致性依次通过，失败则拒绝或保留未知。</desc><rect width="1200" height="300" fill="#f8fafc"/><text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#17324d">外部请求：先过边界，再形成证据</text><g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="40" y="90" width="220" height="120" rx="16" fill="#e8f1ff" stroke="#3973c6" stroke-width="2"/><text x="150" y="128" fill="#17324d">1 输入</text><text x="150" y="158" fill="#17324d">类型、字段、范围</text><text x="150" y="185" fill="#17324d">不合格：拒绝</text><rect x="330" y="90" width="220" height="120" rx="16" fill="#fff3d6" stroke="#b7791f" stroke-width="2"/><text x="440" y="128" fill="#5f370e">2 授权</text><text x="440" y="158" fill="#5f370e">身份与资源范围</text><text x="440" y="185" fill="#5f370e">不合格：拒绝</text><rect x="620" y="90" width="220" height="120" rx="16" fill="#eee6ff" stroke="#7652a8" stroke-width="2"/><text x="730" y="128" fill="#3f2a61">3 响应</text><text x="730" y="158" fill="#3f2a61">状态、大小、协议</text><text x="730" y="185" fill="#3f2a61">超时：未知</text><rect x="910" y="90" width="220" height="120" rx="16" fill="#e8f7ef" stroke="#2f855a" stroke-width="2"/><text x="1020" y="128" fill="#174b2b">4 业务一致性</text><text x="1020" y="158" fill="#174b2b">对象、版本、哈希</text><text x="1020" y="185" fill="#174b2b">通过：可引用</text><g stroke="#64748b" stroke-width="3" fill="none"><path d="M260 150h60"/><path d="M550 150h60"/><path d="M840 150h60"/></g><g fill="#64748b"><path d="M320 150l-12-8v16z"/><path d="M610 150l-12-8v16z"/><path d="M900 150l-12-8v16z"/></g><text x="600" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">颜色辅助分层；每个状态由文字和位置共同表达。教学构造，未验证真实服务。</text></svg>