<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="980" height="280" fill="#FAFAF9"/><text x="40" y="42" font-size="25" font-weight="700" fill="#1F2937">检索系统怎样保住来源、版本和可核证据</text><text x="40" y="72" font-size="15" fill="#475569">先恢复文档含义并建立版本化块，再评估召回、重排与多跳策略；没有来源证据时必须保留不足。</text><rect x="40" y="110" width="220" height="88" rx="16" fill="#E8F1FF" stroke="#2563EB" stroke-width="2"/><text x="150" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#173B70">输入与目标</text><text x="150" y="174" text-anchor="middle" font-size="14" fill="#173B70">约束、版本、预算</text><path d="M260 154H335" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/><rect x="340" y="110" width="220" height="88" rx="16" fill="#FFF7DB" stroke="#D97706" stroke-width="2"/><text x="450" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#7A4100">候选步骤</text><text x="450" y="174" text-anchor="middle" font-size="14" fill="#7A4100">工具、计划或查询</text><path d="M560 154H635" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/><rect x="640" y="110" width="220" height="88" rx="16" fill="#E9F8EF" stroke="#15803D" stroke-width="2"/><text x="750" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#14532D">证据判定</text><text x="750" y="174" text-anchor="middle" font-size="14" fill="#14532D">继续、等待或停止</text><text x="40" y="245" font-size="13" fill="#64748B">颜色用于分组；文字与箭头保持分离，图像不可用时以正文和代码降级。</text></svg>